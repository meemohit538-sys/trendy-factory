function(event){

);

){

)
){

}


selectedImages.push(file);

}
);


renderImagePreviews();


event.target.value =

};

const grid =
document.getElementById(
"imagePreviewGrid"
);

"";

existingImages.forEach(

);

);

grid.appendChild(box);

}

reader.readAsDataURL(file);

);

async function uploadImageToCloudinary(file){

const formData =

file
);

"upload_preset",

{

method:"POST",

body:formData

}

);


const data =
await response.json();


if(!response.ok){

console.error(data);

throw new Error(
data.error?.message ||
"Image upload failed"
);

}


return data.secure_url;

}
