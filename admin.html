<script type="module">

measurementId: "G-8YDMBE9T7C"

/* ================= INITIALIZE ================= */

const app =
initializeApp(firebaseConfig);


const db =
getFirestore(app);


const auth =
getAuth(app);


const storage =
getStorage(app);


/* ================= VARIABLES ================= */

let selectedFiles = [];

let existingImages = [];

let editingProductData = null;


/* ================= ADMIN LOGIN ================= */

window.adminLogin =
async function(){

const email =
document
.getElementById(
"adminEmail"
)
.value
.trim();


const password =
document
.getElementById(
"adminPassword"
)
.value;


const errorBox =
document
.getElementById(
"loginError"
);


errorBox.textContent =

if(!email || !password){

errorBox.textContent =
"Please enter email and password.";

return;

}


try{

await signInWithEmailAndPassword(
auth,

password
);

}catch(error){

console.error(error);

errorBox.textContent =
"Invalid email or password.";

}

};


/* ================= AUTH STATE ================= */

onAuthStateChanged(
auth,
user => {

if(user){

document
.getElementById(
"loginPage"
)
.style.display =
"none";


document
.getElementById(
"adminPanel"
)
.classList.add(
"active"
);


document
.getElementById(
"adminUser"
).textContent =
user.email;


loadAdminProducts();

loadCoupons();

loadOrders();

}else{

document
.getElementById(
"loginPage"
)
.style.display =
"flex";


document
.getElementById(
"adminPanel"
)
.classList.remove(
"active"
);

}

}
);


/* ================= LOGOUT ================= */

window.adminLogout =
async function(){

try{

await signOut(auth);

}catch(error){

console.error(error);

}

};


/* ================= TAB SYSTEM ================= */

window.openTab =
function(tabName,button){

document
.querySelectorAll(
".tab-btn"
)
.forEach(
btn => {

btn.classList.remove(
"active"
);

}
);


document
.querySelectorAll(
".tab-content"
)
.forEach(
tab => {

tab.classList.remove(
"active"
);

}
);


button.classList.add(
"active"
);


document
.getElementById(
tabName + "Tab"
)
.classList.add(
"active"
);


/* REFRESH DATA */

if(tabName === "products"){

loadAdminProducts();

}


if(tabName === "coupons"){

loadCoupons();

}


if(tabName === "orders"){

loadOrders();

}

};


/* ================= IMAGE SELECTION ================= */

window.handleImageSelection =
function(event){

const files =
Array.from(
event.target.files
);


/* TOTAL COUNT */

const totalImages =
existingImages.length +
selectedFiles.length +
files.length;


/* MAXIMUM 5 */

if(totalImages > 5){

alert(
"You can upload maximum 5 images per product."
);

event.target.value =
"";

return;

}


/* VALIDATE IMAGES */

for(
const file of files
){

if(
!file.type.startsWith(
"image/"
)
){

alert(
"Please select only image files."
);

event.target.value =
"";

return;

}

}


/* ADD FILES */

selectedFiles.push(
...files
);


/* RESET INPUT */

event.target.value =
"";


renderImagePreviews();

};


/* ================= RENDER IMAGE PREVIEW ================= */

function renderImagePreviews(){

const grid =
document.getElementById(
"imagePreviewGrid"
);


grid.innerHTML =
"";


/* EXISTING IMAGES */

existingImages.forEach(
(imageUrl,index) => {

const preview =
document.createElement(
"div"
);


preview.className =
"image-preview";


preview.innerHTML = `

<img
src="${imageUrl}"
alt="Product Image">

<button
class="remove-image"
type="button">

×
</button>

`;


preview
.querySelector(
".remove-image"
)
.onclick =
function(){

existingImages.splice(
index,
1
);


renderImagePreviews();

};


grid.appendChild(
preview
);

}
);


/* NEW FILES */

selectedFiles.forEach(
(file,index) => {

const preview =
document.createElement(
"div"
);


preview.className =
"image-preview";


const imageUrl =
URL.createObjectURL(
file
);


preview.innerHTML = `

<img
src="${imageUrl}"
alt="New Product Image">

<button
class="remove-image"
type="button">

×
</button>

`;


preview
.querySelector(
".remove-image"
)
.onclick =
function(){

selectedFiles.splice(
index,
1
);


URL.revokeObjectURL(
imageUrl
);


renderImagePreviews();

};


grid.appendChild(
preview
);

}
);

}


/* ================= UPLOAD IMAGES ================= */

async function uploadProductImages(productId){

const uploadedUrls =
[];


/* LOOP SELECTED FILES */

for(
let i = 0;
i < selectedFiles.length;
i++
){

const file =
selectedFiles[i];


/* UNIQUE FILE NAME */

const fileName =

Date.now() +
"_" +
i +
"_" +
file.name
.replace(
/[^a-zA-Z0-9._-]/g,
"_"
);


/* STORAGE PATH */

const storageRef =
ref(

storage,

"products/" +
productId +
"/" +
fileName

);


/* UPLOAD */

await uploadBytes(
storageRef,
file
);


/* GET URL */

const downloadUrl =
await getDownloadURL(
storageRef
);


uploadedUrls.push(
downloadUrl
);

}


return uploadedUrls;

}

async function(){

const name =
document
.getElementById(
"productName"
)
.value
.trim();


const category =
document
.getElementById(
"productCategory"
)
.value;


const price =
Number(
document
.getElementById(
"productPrice"
)
.value
);


const stock =
Number(
document
.getElementById(
"productStock"
)

);

}

};
