<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TRENDY FACTORY — Admin Panel</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f5f0e8;
color:#211e1a;
}

button,input,textarea,select{
font:inherit;
}

/* LOGIN */

.login-page{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.login-box{
width:100%;
max-width:400px;
background:#fffaf4;
padding:40px;
border:1px solid #ddd5ca;
}

.login-box h1{
font-family:Georgia,serif;
font-weight:400;
margin-bottom:10px;
}

.login-box p{
color:#766d63;
font-size:13px;
margin-bottom:25px;
}

.login-box input{
width:100%;
padding:14px;
margin-bottom:15px;
border:1px solid #cfc3b5;
}

.login-box button,
.main-btn{
width:100%;
padding:15px;
border:none;
background:#211e1a;
color:white;
cursor:pointer;
letter-spacing:1px;
}

/* ADMIN */

.admin-panel{
display:none;
}

.admin-header{
background:#211e1a;
color:white;
padding:20px 5%;
display:flex;
justify-content:space-between;
align-items:center;
}

.admin-logo{
letter-spacing:2px;
font-size:16px;
font-weight:bold;
}

.logout-btn{
background:transparent;
border:1px solid #aaa;
color:white;
padding:8px 15px;
cursor:pointer;
}

.admin-container{
padding:40px 5%;
max-width:1400px;
margin:auto;
}

.admin-title{
font-family:Georgia,serif;
font-weight:400;
font-size:40px;
margin-bottom:30px;
}

/* STATS */

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
margin-bottom:40px;
}

.stat-card{
background:#fffaf4;
padding:25px;
border:1px solid #ddd5ca;
}

.stat-card span{
font-size:10px;
letter-spacing:1px;
color:#766d63;
}

.stat-card h2{
font-size:30px;
margin-top:10px;
}

/* SECTIONS */

.section-card{
background:#fffaf4;
padding:25px;
border:1px solid #ddd5ca;
margin-bottom:30px;
}

.section-card h2{
font-family:Georgia,serif;
font-weight:400;
margin-bottom:25px;
}

/* PRODUCT FORM */

.product-form{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

.product-form input,
.product-form select,
.product-form textarea{
width:100%;
padding:13px;
border:1px solid #cfc3b5;
background:white;
}

.product-form textarea{
min-height:90px;
resize:vertical;
}

.full-width{
grid-column:1/-1;
}

.form-btn{
background:#211e1a;
color:white;
border:none;
padding:14px 20px;
cursor:pointer;
letter-spacing:1px;
}

#cancelEditBtn{
background:#777;
}

/* PRODUCTS */

.products-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
}

.admin-product{
background:white;
border:1px solid #ddd5ca;
padding:18px;
}

.admin-product h3{
font-size:16px;
margin-bottom:8px;
}

.admin-product p{
font-size:13px;
color:#655d55;
margin-bottom:6px;
}

.product-actions{
display:flex;
gap:8px;
margin-top:15px;
}

.edit-btn,
.delete-btn{
border:none;
padding:9px 13px;
cursor:pointer;
font-size:10px;
letter-spacing:1px;
}

.edit-btn{
background:#211e1a;
color:white;
}

.delete-btn{
background:#a52a2a;
color:white;
}

.empty{
text-align:center;
padding:40px;
color:#766d63;
}

/* ORDERS */

.order-card{
border:1px solid #ddd5ca;
padding:20px;
margin-bottom:15px;
background:white;
}

.order-top{
display:flex;
justify-content:space-between;
gap:20px;
margin-bottom:15px;
flex-wrap:wrap;
}

.order-id{
font-weight:bold;
font-size:13px;
}

.order-date{
font-size:11px;
color:#766d63;
margin-top:5px;
}

.order-status{
padding:7px 10px;
border:1px solid #211e1a;
background:white;
font-size:11px;
}

.order-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
border-top:1px solid #eee;
padding-top:15px;
}

.order-info h4,
.order-items h4{
font-size:10px;
letter-spacing:1px;
margin-bottom:8px;
}

.order-info p{
font-size:13px;
line-height:1.6;
color:#4d4740;
}

.order-items{
margin-top:15px;
padding-top:15px;
border-top:1px solid #eee;
}

.product-line{
display:flex;
justify-content:space-between;
font-size:13px;
padding:7px 0;
}

.order-total{
margin-top:15px;
padding-top:15px;
border-top:1px solid #ddd;
font-size:15px;
display:flex;
justify-content:space-between;
}

.delete-order{
margin-top:15px;
background:#a52a2a;
color:white;
border:none;
padding:9px 14px;
cursor:pointer;
font-size:10px;
}

.loading{
text-align:center;
padding:25px;
color:#766d63;
}

@media(max-width:800px){

.stats{
grid-template-columns:repeat(2,1fr);
}

.product-form{
grid-template-columns:1fr;
}

.products-grid{
grid-template-columns:1fr;
}

.order-grid{
grid-template-columns:1fr;
}

.admin-title{
font-size:32px;
}

}
</style>

</head>

<body>

<!-- LOGIN -->

<div class="login-page" id="loginPage">

<div class="login-box">

<h1>Admin Login</h1>

<p>TRENDY FACTORY MANAGEMENT</p>

<input
type="text"
id="adminUsername"
placeholder="Username"

>

<input
type="password"
id="adminPassword"
placeholder="Password"

>

<button onclick="login()">
LOGIN
</button>

<p
id="loginMessage"
style="color:red;margin-top:15px;font-size:12px"
></p>

</div>

</div>

<!-- ADMIN PANEL -->

<div class="admin-panel" id="adminPanel">

<div class="admin-header">

<div class="admin-logo">
TRENDY FACTORY — ADMIN
</div>

<button class="logout-btn" onclick="logout()">
LOGOUT
</button>

</div>

<div class="admin-container">

<h1 class="admin-title">
Dashboard
</h1>

<!-- STATS -->

<div class="stats">

<div class="stat-card">
<span>TOTAL PRODUCTS</span>
<h2 id="totalProducts">0</h2>
</div>

<div class="stat-card">
<span>TOTAL ORDERS</span>
<h2 id="totalOrders">0</h2>
</div>

<div class="stat-card">
<span>PENDING ORDERS</span>
<h2 id="pendingOrders">0</h2>
</div>

<div class="stat-card">
<span>TOTAL SALES</span>
<h2>₹<span id="totalSales">0</span></h2>
</div>

</div>

<!-- ADD PRODUCT -->

<div class="section-card">

<h2 id="formTitle">
Add New Product
</h2>

<div class="product-form">

<input type="hidden" id="editProductId">

<input
id="productName"
type="text"
placeholder="Product Name"

>

<input
id="productPrice"
type="number"
placeholder="Price"

>

<select id="productCategory">

<option value="">Select Category</option>
<option value="shirts">Shirts</option>
<option value="tshirts">T-Shirts</option>
<option value="pants">Pants</option>
<option value="jackets">Jackets</option>

</select>

<input
id="productSizes"
type="text"
placeholder="Sizes e.g. S,M,L,XL"

>

<textarea
id="productDescription"
class="full-width"
placeholder="Product Description"
></textarea>

<button
class="form-btn full-width"
onclick="saveProduct()"
id="saveProductBtn"

>

ADD PRODUCT </button>

<button
class="form-btn full-width"
id="cancelEditBtn"
onclick="cancelEdit()"
style="display:none;background:#777"

>

CANCEL EDIT </button>

</div>

</div>

<!-- PRODUCT LIST -->

<div class="section-card">

<h2>Manage Products</h2>

<div
class="products-grid"
id="productsContainer"
>
<div class="loading">Loading products...</div>
</div>

</div>

<!-- ORDERS -->

<div class="section-card">

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:25px">

<h2 style="margin:0">
Customer Orders
</h2>

<button
class="form-btn"
onclick="loadOrders()"
style="width:auto"

>

REFRESH </button>

</div>

<div id="ordersContainer">
<div class="loading">Loading orders...</div>
</div>

</div>

</div>

</div>

<script type="module">

/* ========================================
FIREBASE IMPORTS
======================================== */

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
addDoc,
doc,
updateDoc,
deleteDoc,
getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* ========================================
FIREBASE CONFIG
======================================== */

const firebaseConfig = {

apiKey: "AIzaSyCZjafz8Ze5p6xSoir4j5IdKc_MJE_Eyns",

authDomain: "trendy-factory.firebaseapp.com",

projectId: "trendy-factory",

storageBucket: "trendy-factory.firebasestorage.app",

messagingSenderId: "811817163762",

appId: "1:811817163762:web:c9aecc5db2cb332a13696b",

measurementId: "G-8YDMBE9T7C"

};


/* ========================================
INITIALIZE FIREBASE
======================================== */

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* ========================================
ADMIN LOGIN
======================================== */

const ADMIN_USERNAME = "admin";
const ADMIN_PASSWORD = "trendy123";


window.login = function(){

const username =
document.getElementById("adminUsername").value.trim();

const password =
document.getElementById("adminPassword").value.trim();


if(
username === ADMIN_USERNAME &&
password === ADMIN_PASSWORD
){

sessionStorage.setItem(
"adminLoggedIn",
"true"
);

showAdmin();

}else{

document.getElementById(
"loginMessage"
).textContent =
"Invalid username or password.";

}

};


function showAdmin(){

document.getElementById(
"loginPage"
).style.display = "none";

document.getElementById(
"adminPanel"
).style.display = "block";

loadProducts();

loadOrders();

}


window.logout = function(){

sessionStorage.removeItem(
"adminLoggedIn"
);

document.getElementById(
"adminPanel"
).style.display = "none";

document.getElementById(
"loginPage"
).style.display = "flex";

};


/* ========================================
PRODUCTS
======================================== */

let adminProducts = [];


/* LOAD PRODUCTS */

async function loadProducts(){

const container =
document.getElementById(
"productsContainer"
);


container.innerHTML =
'<div class="loading">Loading products...</div>';


try{

const querySnapshot =
await getDocs(
collection(db,"products")
);


adminProducts = [];


querySnapshot.forEach((documentItem) => {

adminProducts.push({

firebaseId:documentItem.id,

...documentItem.data()

});

});


container.innerHTML = "";


if(adminProducts.length === 0){

container.innerHTML =
'<div class="empty">No products found. Add your first product above.</div>';

document.getElementById(
"totalProducts"
).textContent = "0";

return;

}


adminProducts.forEach(product => {

const sizes =
Array.isArray(product.sizes)
? product.sizes.join(", ")
: "";


const productCard =
document.createElement("div");

productCard.className =
"admin-product";


productCard.innerHTML = `

<h3>${product.name || "Unnamed Product"}</h3>

<p>
<strong>₹${product.price || 0}</strong>
</p>

<p>
Category: ${product.category || ""}
</p>

<p>
Sizes: ${sizes}
</p>

<p>
${product.description || ""}
</p>

<div class="product-actions">

<button class="edit-btn">
EDIT
</button>

<button class="delete-btn">
DELETE
</button>

</div>

`;


const buttons =
productCard.querySelectorAll("button");


buttons[0].onclick = function(){

editProduct(
product.firebaseId
);

};


buttons[1].onclick = function(){

deleteProduct(
product.firebaseId
);

};


container.appendChild(
productCard
);

});


document.getElementById(
"totalProducts"
).textContent =
adminProducts.length;


}catch(error){

console.error(error);

container.innerHTML =
'<div class="empty">Error loading products. Check Firebase rules.</div>';

}

}


/* ========================================
SAVE PRODUCT
======================================== */

window.saveProduct = async function(){

const firebaseId =
document.getElementById(
"editProductId"
).value;


const name =
document.getElementById(
"productName"
).value.trim();


const price =
Number(
document.getElementById(
"productPrice"
).value
);


const category =
document.getElementById(
"productCategory"
).value;


const sizesText =
document.getElementById(
"productSizes"
).value.trim();


const description =
document.getElementById(
"productDescription"
).value.trim();


if(!name){

alert("Please enter product name.");

return;

}


if(!price || price <= 0){

alert("Please enter valid price.");

return;

}


if(!category){

alert("Please select category.");

return;

}


if(!sizesText){

alert("Please enter product sizes.");

return;

}


if(!description){

alert("Please enter product description.");

return;

}


const sizes =
sizesText
.split(",")
.map(size => size.trim())
.filter(size => size);


const productData = {

name:name,

price:price,

category:category,

sizes:sizes,

description:description,

image:name,

updatedAt:new Date().toISOString()

};


try{


/* UPDATE */

if(firebaseId){

await updateDoc(

doc(
db,
"products",
firebaseId
),

productData

);

alert(
"Product updated successfully!"
);


/* ADD */

}else{

productData.createdAt =
new Date().toISOString();


await addDoc(

collection(
db,
"products"
),

productData

);


alert(
"Product added successfully!"
);

}


cancelEdit();

await loadProducts();


}catch(error){

console.error(error);

alert(
"Error saving product: " +
error.message
);

}

};


/* ========================================
EDIT PRODUCT
======================================== */

function editProduct(firebaseId){

const product =
adminProducts.find(
item =>
item.firebaseId === firebaseId
);


if(!product){

return;

}


document.getElementById(
"editProductId"
).value =
firebaseId;


document.getElementById(
"productName"
).value =
product.name || "";


document.getElementById(
"productPrice"
).value =
product.price || "";


document.getElementById(
"productCategory"
).value =
product.category || "";


document.getElementById(
"productSizes"
).value =
Array.isArray(product.sizes)
? product.sizes.join(",")
: "";


document.getElementById(
"productDescription"
).value =
product.description || "";


document.getElementById(
"formTitle"
).textContent =
"Edit Product";


document.getElementById(
"saveProductBtn"
).textContent =
"UPDATE PRODUCT";


document.getElementById(
"cancelEditBtn"
).style.display =
"block";


window.scrollTo({

top:0,

behavior:"smooth"

});

}


/* ========================================
CANCEL EDIT
======================================== */

window.cancelEdit = function(){

document.getElementById(
"editProductId"
).value = "";

document.getElementById(
"productName"
).value = "";

document.getElementById(
"productPrice"
).value = "";

document.getElementById(
"productCategory"
).value = "";

document.getElementById(
"productSizes"
).value = "";

document.getElementById(
"productDescription"
).value = "";


document.getElementById(
"formTitle"
).textContent =
"Add New Product";


document.getElementById(
"saveProductBtn"
).textContent =
"ADD PRODUCT";


document.getElementById(
"cancelEditBtn"
).style.display =
"none";

};


/* ========================================
DELETE PRODUCT
======================================== */

async function deleteProduct(firebaseId){

const confirmed =
confirm(
"Delete this product?"
);


if(!confirmed){

return;

}


try{

await deleteDoc(

doc(
db,
"products",
firebaseId
)

);


alert(
"Product deleted successfully!"
);


await loadProducts();


}catch(error){

console.error(error);

alert(
"Error deleting product: " +
error.message
);

}

}


/* ========================================
ORDERS
======================================== */

let allOrders = [];


window.loadOrders = async function(){

const container =
document.getElementById(
"ordersContainer"
);


container.innerHTML =
'<div class="loading">Loading orders...</div>';


try{

const querySnapshot =
await getDocs(
collection(db,"orders")
);


allOrders = [];


querySnapshot.forEach((documentItem) => {

allOrders.push({

firebaseId:documentItem.id,

...documentItem.data()

});

});


document.getElementById(
"totalOrders"
).textContent =
allOrders.length;


const pendingOrders =
allOrders.filter(
order =>
!order.status ||
order.status === "Pending"
).length;


document.getElementById(
"pendingOrders"
).textContent =
pendingOrders;


const totalSales =
allOrders.reduce(
(sum,order) =>
sum + Number(order.total || 0),
0
);


document.getElementById(
"totalSales"
).textContent =
totalSales;


container.innerHTML = "";


if(allOrders.length === 0){

container.innerHTML =
'<div class="empty">No orders yet.</div>';

return;

}


allOrders.forEach(order => {


const status =
order.status || "Pending";


const customer =
order.customer || {};


const items =
Array.isArray(order.items)
? order.items
: [];


const itemsHTML =
items.map(item => `

<div class="product-line">

<span>

${item.name || ""}

<br>

<small>
Size: ${item.size || ""}
</small>

</span>

<strong>
₹${item.price || 0}
</strong>

</div>

`).join("");


const orderCard =
document.createElement("div");

orderCard.className =
"order-card";


orderCard.innerHTML = `

<div class="order-top">

<div>

<div class="order-id">

Order:
${order.orderId || order.firebaseId}

</div>

<div class="order-date">

${order.createdAt
? new Date(order.createdAt).toLocaleString()
: ""}

</div>

</div>


<select class="order-status">

<option value="Pending">
Pending
</option>

<option value="Confirmed">
Confirmed
</option>

<option value="Shipped">
Shipped
</option>

<option value="Delivered">
Delivered
</option>

<option value="Cancelled">
Cancelled
</option>

</select>

</div>


<div class="order-grid">

<div class="order-info">

<h4>
CUSTOMER DETAILS
</h4>

<p>

<strong>
${customer.name || ""}
</strong>

<br>

${customer.phone || ""}

<br>

${customer.email || ""}

</p>

</div>


<div class="order-info">

<h4>
DELIVERY ADDRESS
</h4>

<p>

${customer.address || ""}

<br>

${customer.city || ""},
${customer.state || ""}

<br>

PIN:
${customer.pin || ""}

</p>

</div>

</div>


<div class="order-items">

<h4>
ORDER ITEMS
</h4>

${itemsHTML}

</div>


<div class="order-total">

<span>
Final Total
</span>

<strong>
₹${order.total || 0}
</strong>

</div>


<button class="delete-order">
DELETE ORDER
</button>

`;


const statusSelect =
orderCard.querySelector(
".order-status"
);


statusSelect.value =
status;


statusSelect.onchange =
function(){

updateStatus(
order.firebaseId,
this.value
);

};


const deleteButton =
orderCard.querySelector(
".delete-order"
);


deleteButton.onclick =
function(){

deleteOrder(
order.firebaseId
);

};


container.appendChild(
orderCard
);

});


}catch(error){

console.error(error);

container.innerHTML =
'<div class="empty">Error loading orders. Check Firebase rules.</div>';

}

};


/* ========================================
UPDATE ORDER STATUS
======================================== */

async function updateStatus(firebaseId,status){

try{

await updateDoc(

doc(
db,
"orders",
firebaseId
),

{

status:status,

updatedAt:
new Date().toISOString()

}

);


await loadOrders();


}catch(error){

console.error(error);

alert(
"Error updating order."
);

}

}


/* ========================================
DELETE ORDER
======================================== */

async function deleteOrder(firebaseId){

const confirmed =
confirm(
"Are you sure you want to delete this order?"
);


if(!confirmed){

return;

}


try{

await deleteDoc(

doc(
db,
"orders",
firebaseId
)

);


alert(
"Order deleted."
);


await loadOrders();


}catch(error){

console.error(error);

alert(
"Error deleting order."
);

}

}


/* ========================================
START APP
======================================== */

if(
sessionStorage.getItem(
"adminLoggedIn"
) === "true"
){

showAdmin();

}

</script>

</body>
 </html>
