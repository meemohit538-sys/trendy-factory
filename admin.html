<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TRENDY FACTORY — Admin Panel</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f0e8;
  color:#211e1a;
}

button,input,textarea,select{
  font:inherit;
}

/* LOGIN */

.login-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:400px;
  background:#fffaf4;
  padding:40px;
  border:1px solid #ddd5ca;
}

.login-box h1{
  font-family:Georgia,serif;
  font-weight:400;
  margin-bottom:10px;
}

.login-box p{
  color:#766d63;
  font-size:13px;
  margin-bottom:25px;
}

.login-box input{
  width:100%;
  padding:14px;
  margin-bottom:15px;
  border:1px solid #cfc3b5;
}

.login-box button,
.main-btn{
  width:100%;
  padding:15px;
  border:none;
  background:#211e1a;
  color:white;
  cursor:pointer;
  letter-spacing:1px;
}

/* ADMIN */

.admin-panel{
  display:none;
}

.admin-header{
  background:#211e1a;
  color:white;
  padding:20px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.admin-logo{
  letter-spacing:2px;
  font-size:16px;
  font-weight:bold;
}

.logout-btn{
  background:transparent;
  border:1px solid #aaa;
  color:white;
  padding:8px 15px;
  cursor:pointer;
}

.admin-container{
  padding:40px 5%;
  max-width:1400px;
  margin:auto;
}

.admin-title{
  font-family:Georgia,serif;
  font-weight:400;
  font-size:40px;
  margin-bottom:30px;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:40px;
}

.stat-card{
  background:#fffaf4;
  padding:25px;
  border:1px solid #ddd5ca;
}

.stat-card span{
  font-size:10px;
  letter-spacing:1px;
  color:#766d63;
}

.stat-card h2{
  font-size:30px;
  margin-top:10px;
}

/* SECTION */

.section-card{
  background:#fffaf4;
  padding:25px;
  border:1px solid #ddd5ca;
  margin-bottom:30px;
}

.section-card h2{
  font-family:Georgia,serif;
  font-weight:400;
  margin-bottom:25px;
}

/* PRODUCT FORM */

.product-form{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.product-form input,
.product-form select,
.product-form textarea{
  width:100%;
  padding:13px;
  border:1px solid #cfc3b5;
  background:white;
}

.product-form textarea{
  min-height:90px;
  resize:vertical;
}

.full-width{
  grid-column:1/-1;
}

.form-btn{
  background:#211e1a;
  color:white;
  border:none;
  padding:14px 20px;
  cursor:pointer;
  letter-spacing:1px;
}

#cancelEditBtn{
  background:#777;
}

/* PRODUCTS */

.products-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.admin-product{
  background:white;
  border:1px solid #ddd5ca;
  padding:18px;
}

.admin-product h3{
  font-size:16px;
  margin-bottom:8px;
}

.admin-product p{
  font-size:13px;
  color:#655d55;
  margin-bottom:6px;
}

.product-actions{
  display:flex;
  gap:8px;
  margin-top:15px;
}

.edit-btn,
.delete-btn{
  border:none;
  padding:9px 13px;
  cursor:pointer;
  font-size:10px;
  letter-spacing:1px;
}

.edit-btn{
  background:#211e1a;
  color:white;
}

.delete-btn{
  background:#a52a2a;
  color:white;
}

.empty{
  text-align:center;
  padding:40px;
  color:#766d63;
}

/* ORDERS */

.order-card{
  border:1px solid #ddd5ca;
  padding:20px;
  margin-bottom:15px;
  background:white;
}

.order-top{
  display:flex;
  justify-content:space-between;
  gap:20px;
  margin-bottom:15px;
  flex-wrap:wrap;
}

.order-id{
  font-weight:bold;
  font-size:13px;
}

.order-date{
  font-size:11px;
  color:#766d63;
  margin-top:5px;
}

.order-status{
  padding:7px 10px;
  border:1px solid #211e1a;
  background:white;
  font-size:11px;
}

.order-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  border-top:1px solid #eee;
  padding-top:15px;
}

.order-info h4,
.order-items h4{
  font-size:10px;
  letter-spacing:1px;
  margin-bottom:8px;
}

.order-info p{
  font-size:13px;
  line-height:1.6;
  color:#4d4740;
}

.order-items{
  margin-top:15px;
  padding-top:15px;
  border-top:1px solid #eee;
}

.product-line{
  display:flex;
  justify-content:space-between;
  font-size:13px;
  padding:7px 0;
}

.order-total{
  margin-top:15px;
  padding-top:15px;
  border-top:1px solid #ddd;
  font-size:15px;
  display:flex;
  justify-content:space-between;
}

.delete-order{
  margin-top:15px;
  background:#a52a2a;
  color:white;
  border:none;
  padding:9px 14px;
  cursor:pointer;
  font-size:10px;
}

@media(max-width:800px){

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .product-form{
    grid-template-columns:1fr;
  }

  .products-grid{
    grid-template-columns:1fr;
  }

  .order-grid{
    grid-template-columns:1fr;
  }

  .admin-title{
    font-size:32px;
  }

}

</style>

</head>

<div class="admin-logo">

<h1 class="admin-title">Dashboard</h1>

<script type="module">

/* =========================
FIREBASE IMPORTS
========================= */

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  addDoc,
  updateDoc,
  deleteDoc,
  doc,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================
FIREBASE CONFIG
========================= */

const firebaseConfig = {
  apiKey: "AIzaSyCZjafz8Ze5p6xSoir4j5IdKc_MJE_Eyns",
  authDomain: "trendy-factory.firebaseapp.com",
  projectId: "trendy-factory",
  storageBucket: "trendy-factory.firebasestorage.app",
  messagingSenderId: "811817163762",
  appId: "1:811817163762:web:c9aecc5db2cb332a13696b",
  measurementId: "G-8YDMBE9T7C"
};


/* =========================
INITIALIZE FIREBASE
========================= */

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* =========================
ADMIN LOGIN
========================= */

const ADMIN_USERNAME = "admin";

const ADMIN_PASSWORD = "trendy123";


window.login = function(){

  const username =
  document.getElementById("adminUsername").value.trim();

  const password =
  document.getElementById("adminPassword").value.trim();


  if(
    username === ADMIN_USERNAME &&
    password === ADMIN_PASSWORD
  ){

    localStorage.setItem(
      "adminLoggedIn",
      "true"
    );

    showAdmin();

  }else{

    document.getElementById(
      "loginMessage"
    ).textContent =
    "Invalid username or password.";

  }

};


window.showAdmin = function(){

  document.getElementById(
    "loginPage"
  ).style.display = "none";


  document.getElementById(
    "adminPanel"
  ).style.display = "block";


  loadProducts();

  loadOrders();

};


window.logout = function(){

  localStorage.removeItem(
    "adminLoggedIn"
  );


  document.getElementById(
    "adminPanel"
  ).style.display = "none";


  document.getElementById(
    "loginPage"
  ).style.display = "flex";

};


/* =========================
PRODUCTS
========================= */

let adminProducts = [];


/* =========================
LOAD PRODUCTS
========================= */

async function loadProducts(){

  const container =
  document.getElementById(
    "productsContainer"
  );


  container.innerHTML =
  '<div class="empty">Loading products...</div>';


  try{

    const snapshot =
    await getDocs(
      collection(db,"products")
    );


    adminProducts = [];


    snapshot.forEach(documentData => {

      adminProducts.push({

        id:documentData.id,

        ...documentData.data()

      });

    });


    renderProducts();


  }catch(error){

    console.error(error);

    container.innerHTML =
    '<div class="empty">Error loading products.</div>';

  }

}


/* =========================
REALTIME PRODUCTS
========================= */

onSnapshot(
  collection(db,"products"),

  snapshot => {

    adminProducts = [];


    snapshot.forEach(documentData => {

      adminProducts.push({

        id:documentData.id,

        ...documentData.data()

      });

    });


    if(
      document.getElementById("adminPanel")
      .style.display === "block"
    ){

      renderProducts();

    }

  },

  error => {

    console.error(
      "Realtime error:",
      error
    );

  }

);


/* =========================
RENDER PRODUCTS
========================= */

function renderProducts(){

  const container =
  document.getElementById(
    "productsContainer"
  );


  container.innerHTML = "";


  if(
    adminProducts.length === 0
  ){

    container.innerHTML =
    '<div class="empty">No products found. Add your first product.</div>';


    document.getElementById(
      "totalProducts"
    ).textContent = "0";


    return;

  }


  adminProducts.forEach(product => {


    const sizes =
    Array.isArray(product.sizes)
    ? product.sizes.join(", ")
    : "";


    container.innerHTML += `

    <div class="admin-product">

      <h3>
        ${product.name || "Unnamed Product"}
      </h3>

      <p>
        <strong>
          ₹${product.price || 0}
        </strong>
      </p>

      <p>
        Category:
        ${product.category || ""}
      </p>

      <p>
        Sizes:
        ${sizes}
      </p>

      <p>
        ${product.description || ""}
      </p>


      <div class="product-actions">

        <button
          class="edit-btn"
          onclick="editProduct('${product.id}')"
        >
          EDIT
        </button>


        <button
          class="delete-btn"
          onclick="deleteProduct('${product.id}')"
        >
          DELETE
        </button>

      </div>

    </div>

    `;

  });


  document.getElementById(
    "totalProducts"
  ).textContent =
  adminProducts.length;

}


/* =========================
SAVE PRODUCT
========================= */

window.saveProduct =
async function(){

  const id =
  document.getElementById(
    "editProductId"
  ).value;


  const name =
  document.getElementById(
    "productName"
  ).value.trim();


  const price =
  Number(
    document.getElementById(
      "productPrice"
    ).value
  );


  const category =
  document.getElementById(
    "productCategory"
  ).value;


  const sizesText =
  document.getElementById(
    "productSizes"
  ).value.trim();


  const description =
  document.getElementById(
    "productDescription"
  ).value.trim();


  /* VALIDATION */

  if(!name){

    alert(
      "Please enter product name."
    );

    return;

  }


  if(!price || price <= 0){

    alert(
      "Please enter valid price."
    );

    return;

  }


  if(!category){

    alert(
      "Please select category."
    );

    return;

  }


  if(!sizesText){

    alert(
      "Please enter product sizes."
    );

    return;

  }


  if(!description){

    alert(
      "Please enter product description."
    );

    return;

  }


  const sizes =
  sizesText
  .split(",")
  .map(size => size.trim())
  .filter(size => size);


  const productData = {

    name:name,

    price:price,

    category:category,

    sizes:sizes,

    description:description,

    image:name,

    updatedAt:
    new Date().toISOString()

  };


  try{


    /* EDIT PRODUCT */

    if(id){

      await updateDoc(

        doc(
          db,
          "products",
          id
        ),

        productData

      );


      alert(
        "Product updated successfully!"
      );


      cancelEdit();


    }else{


      /* ADD PRODUCT */

      productData.createdAt =
      new Date().toISOString();


      await addDoc(

        collection(
          db,
          "products"
        ),

        productData

      );


      alert(
        "Product added successfully!"
      );


      clearForm();

    }


  }catch(error){

    console.error(error);

    alert(
      "Error saving product: " +
      error.message
    );

  }

};


/* =========================
EDIT PRODUCT
========================= */

window.editProduct =
function(id){

  const product =
  adminProducts.find(
    product => product.id === id
  );


  if(!product){

    alert(
      "Product not found."
    );

    return;

  }


  document.getElementById(
    "editProductId"
  ).value =
  product.id;


  document.getElementById(
    "productName"
  ).value =
  product.name || "";


  document.getElementById(
    "productPrice"
  ).value =
  product.price || "";


  document.getElementById(
    "productCategory"
  ).value =
  product.category || "";


  document.getElementById(
    "productSizes"
  ).value =
  Array.isArray(product.sizes)
  ? product.sizes.join(",")
  : "";


  document.getElementById(
    "productDescription"
  ).value =
  product.description || "";


  document.getElementById(
    "formTitle"
  ).textContent =
  "Edit Product";


  document.getElementById(
    "saveProductBtn"
  ).textContent =
  "UPDATE PRODUCT";


  document.getElementById(
    "cancelEditBtn"
  ).style.display =
  "block";


  window.scrollTo({

    top:0,

    behavior:"smooth"

  });

};


/* =========================
CANCEL EDIT
========================= */

window.cancelEdit =
function(){

  clearForm();


  document.getElementById(
    "formTitle"
  ).textContent =
  "Add New Product";


  document.getElementById(
    "saveProductBtn"
  ).textContent =
  "ADD PRODUCT";


  document.getElementById(
    "cancelEditBtn"
  ).style.display =
  "none";

};


/* =========================
CLEAR FORM
========================= */

function clearForm(){

  document.getElementById(
    "editProductId"
  ).value = "";


  document.getElementById(
    "productName"
  ).value = "";


  document.getElementById(
    "productPrice"
  ).value = "";


  document.getElementById(
    "productCategory"
  ).value = "";


  document.getElementById(
    "productSizes"
  ).value = "";


  document.getElementById(
    "productDescription"
  ).value = "";

}


/* =========================
DELETE PRODUCT
========================= */

window.deleteProduct =
async function(id){

  const confirmed =
  confirm(
    "Delete this product?"
  );


  if(!confirmed){

    return;

  }


  try{

    await deleteDoc(

      doc(
        db,
        "products",
        id
      )

    );


    alert(
      "Product deleted successfully!"
    );


  }catch(error){

    console.error(error);


    alert(
      "Error deleting product."
    );

  }

};


/* =========================
ORDERS
========================= */

let adminOrders = [];


window.loadOrders =
async function(){

  const container =
  document.getElementById(
    "ordersContainer"
  );


  container.innerHTML =
  '<div class="empty">Loading orders...</div>';


  try{

    const snapshot =
    await getDocs(
      collection(db,"orders")
    );


    adminOrders = [];


    snapshot.forEach(documentData => {

      adminOrders.push({

        id:documentData.id,

        ...documentData.data()

      });

    });


    renderOrders();


  }catch(error){

    console.error(error);


    container.innerHTML =
    '<div class="empty">No orders found.</div>';

  }

};


/* =========================
REALTIME ORDERS
========================= */

onSnapshot(
  collection(db,"orders"),

  snapshot => {

    adminOrders = [];


    snapshot.forEach(documentData => {

      adminOrders.push({

        id:documentData.id,

        ...documentData.data()

      });

    });


    if(
      document.getElementById("adminPanel")
      .style.display === "block"
    ){

      renderOrders();

    }

  },

  error => {

    console.error(
      "Orders realtime error:",
      error
    );

  }

);


/* =========================
RENDER ORDERS
========================= */

function renderOrders(){

  const container =
  document.getElementById(
    "ordersContainer"
  );


  container.innerHTML = "";


  document.getElementById(
    "totalOrders"
  ).textContent =
  adminOrders.length;


  const pending =
  adminOrders.filter(
    order =>
    !order.status ||
    order.status === "Pending"
  ).length;


  document.getElementById(
    "pendingOrders"
  ).textContent =
  pending;


  const sales =
  adminOrders.reduce(

    (sum,order) =>

    sum +
    Number(order.total || 0),

    0

  );


  document.getElementById(
    "totalSales"
  ).textContent =
  sales;


  if(
    adminOrders.length === 0
  ){

    container.innerHTML =
    '<div class="empty">No orders yet.</div>';


    return;

  }


  adminOrders.forEach(order => {


    const customer =
    order.customer || {};


    const items =
    Array.isArray(order.items)
    ? order.items
    : [];


    const itemsHTML =
    items.map(item => `

      <div class="product-line">

        <span>

          ${item.name || ""}

          <br>

          <small>
            Size:
            ${item.size || ""}
          </small>

        </span>

        <strong>
          ₹${item.price || 0}
        </strong>

      </div>

    `).join("");


    const status =
    order.status ||
    "Pending";


    const date =
    order.createdAt
    ? new Date(
        order.createdAt
      ).toLocaleString()
    : "";


    container.innerHTML += `

    <div class="order-card">

      <div class="order-top">

        <div>

          <div class="order-id">

            Order:
            ${order.id}

          </div>


          <div class="order-date">

            ${date}

          </div>

        </div>


        <select
          class="order-status"
          onchange="updateOrderStatus('${order.id}',this.value)"
        >

          <option
            value="Pending"
            ${status === "Pending" ? "selected" : ""}
          >
            Pending
          </option>

          <option
            value="Confirmed"
            ${status === "Confirmed" ? "selected" : ""}
          >
            Confirmed
          </option>

          <option
            value="Shipped"
            ${status === "Shipped" ? "selected" : ""}
          >
            Shipped
          </option>

          <option
            value="Delivered"
            ${status === "Delivered" ? "selected" : ""}
          >
            Delivered
          </option>

          <option
            value="Cancelled"
            ${status === "Cancelled" ? "selected" : ""}
          >
            Cancelled
          </option>

        </select>

      </div>


      <div class="order-grid">

        <div class="order-info">

          <h4>
            CUSTOMER DETAILS
          </h4>

          <p>

            <strong>
              ${customer.name || ""}
            </strong>

            <br>

            ${customer.phone || ""}

            <br>

            ${customer.email || ""}

          </p>

        </div>


        <div class="order-info">

          <h4>
            DELIVERY ADDRESS
          </h4>

          <p>

            ${customer.address || ""}

            <br>

            ${customer.city || ""},
            ${customer.state || ""}

            <br>

            PIN:
            ${customer.pin || ""}

          </p>

        </div>

      </div>


      <div class="order-items">

        <h4>
          ORDER ITEMS
        </h4>

        ${itemsHTML}

      </div>


      <div class="order-total">

        <span>
          Final Total
        </span>

        <strong>
          ₹${order.total || 0}
        </strong>

      </div>


      <button
        class="delete-order"
        onclick="deleteOrder('${order.id}')"
      >
        DELETE ORDER
      </button>

    </div>

    `;

  });

}


/* =========================
UPDATE ORDER STATUS
========================= */

window.updateOrderStatus =
async function(id,status){

  try{

    await updateDoc(

      doc(
        db,
        "orders",
        id
      ),

      {

        status:status,

        updatedAt:
        new Date().toISOString()

      }

    );


  }catch(error){

    console.error(error);

    alert(
      "Error updating order status."
    );

  }

};


/* =========================
DELETE ORDER
========================= */

window.deleteOrder =
async function(id){

  const confirmed =
  confirm(
    "Are you sure you want to delete this order?"
  );


  if(!confirmed){

    return;

  }


  try{

    await deleteDoc(

      doc(
        db,
        "orders",
        id
      )

    );


    alert(
      "Order deleted successfully!"
    );


  }catch(error){

    console.error(error);

    alert(
      "Error deleting order."
    );

  }

};

START APP
========================= */

if(
  localStorage.getItem(
    "adminLoggedIn"
  ) === "true"
){

  showAdmin();

}
