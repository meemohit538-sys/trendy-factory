<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRENDY FACTORY — Admin Panel</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f5f0e8;
color:#211e1a;
}

/* LOGIN */

.login-page{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.login-box{
width:100%;
max-width:400px;
background:#fffaf4;
padding:40px;
border:1px solid #ddd5ca;
}

.login-box h1{
font-family:Georgia,serif;
font-weight:400;
margin-bottom:10px;
}

.login-box p{
color:#766d63;
font-size:13px;
margin-bottom:25px;
}

.login-box input{
width:100%;
padding:14px;
margin-bottom:15px;
border:1px solid #cfc3b5;
}

.login-box button,
.main-btn{
width:100%;
padding:15px;
border:none;
background:#211e1a;
color:white;
cursor:pointer;
letter-spacing:1px;
}

/* ADMIN */

.admin-panel{
display:none;
}

.admin-header{
background:#211e1a;
color:white;
padding:20px 5%;
display:flex;
justify-content:space-between;
align-items:center;
}

.admin-logo{
letter-spacing:2px;
font-size:16px;
font-weight:bold;
}

.logout-btn{
background:transparent;
border:1px solid #aaa;
color:white;
padding:8px 15px;
cursor:pointer;
}

.admin-container{
padding:40px 5%;
max-width:1400px;
margin:auto;
}

.admin-title{
font-family:Georgia,serif;
font-weight:400;
font-size:40px;
margin-bottom:30px;
}

/* STATS */

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
margin-bottom:40px;
}

.stat-card{
background:#fffaf4;
padding:25px;
border:1px solid #ddd5ca;
}

.stat-card span{
font-size:10px;
letter-spacing:1px;
color:#766d63;
}

.stat-card h2{
font-size:30px;
margin-top:10px;
}

/* SECTIONS */

.section-card{
background:#fffaf4;
padding:25px;
border:1px solid #ddd5ca;
margin-bottom:30px;
}

.section-card h2{
font-family:Georgia,serif;
font-weight:400;
margin-bottom:25px;
}

/* PRODUCT FORM */

.product-form{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

.product-form input,
.product-form select,
.product-form textarea{
width:100%;
padding:13px;
border:1px solid #cfc3b5;
background:white;
}

.product-form textarea{
min-height:90px;
resize:vertical;
}

.full-width{
grid-column:1/-1;
}

.form-btn{
background:#211e1a;
color:white;
border:none;
padding:14px 20px;
cursor:pointer;
letter-spacing:1px;
}

#cancelEditBtn{
background:#777;
}

/* PRODUCTS */

.products-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
}

.admin-product{
background:white;
border:1px solid #ddd5ca;
padding:18px;
}

.admin-product h3{
font-size:16px;
margin-bottom:8px;
}

.admin-product p{
font-size:13px;
color:#655d55;
margin-bottom:6px;
}

.product-actions{
display:flex;
gap:8px;
margin-top:15px;
}

.edit-btn,
.delete-btn{
border:none;
padding:9px 13px;
cursor:pointer;
font-size:10px;
letter-spacing:1px;
}

.edit-btn{
background:#211e1a;
color:white;
}

.delete-btn{
background:#a52a2a;
color:white;
}

.empty{
text-align:center;
padding:40px;
color:#766d63;
}

/* ORDERS */

.order-card{
border:1px solid #ddd5ca;
padding:20px;
margin-bottom:15px;
background:white;
}

.order-top{
display:flex;
justify-content:space-between;
gap:20px;
margin-bottom:15px;
flex-wrap:wrap;
}

.order-id{
font-weight:bold;
font-size:13px;
}

.order-date{
font-size:11px;
color:#766d63;
margin-top:5px;
}

.order-status{
padding:7px 10px;
border:1px solid #211e1a;
background:white;
font-size:11px;
}

.order-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
border-top:1px solid #eee;
padding-top:15px;
}

.order-info h4,
.order-items h4{
font-size:10px;
letter-spacing:1px;
margin-bottom:8px;
}

.order-info p{
font-size:13px;
line-height:1.6;
color:#4d4740;
}

.order-items{
margin-top:15px;
padding-top:15px;
border-top:1px solid #eee;
}

.product-line{
display:flex;
justify-content:space-between;
font-size:13px;
padding:7px 0;
}

.order-total{
margin-top:15px;
padding-top:15px;
border-top:1px solid #ddd;
font-size:15px;
display:flex;
justify-content:space-between;
}

.delete-order{
margin-top:15px;
background:#a52a2a;
color:white;
border:none;
padding:9px 14px;
cursor:pointer;
font-size:10px;
}

@media(max-width:800px){

.stats{
grid-template-columns:repeat(2,1fr);
}

.product-form{
grid-template-columns:1fr;
}

.products-grid{
grid-template-columns:1fr;
}

.order-grid{
grid-template-columns:1fr;
}

.admin-title{
font-size:32px;
}

}
</style>
</head>

<body>

<!-- LOGIN -->

<div class="login-page" id="loginPage">

<div class="login-box">

<h1>Admin Login</h1>

<p>TRENDY FACTORY MANAGEMENT</p>

<input
type="text"
id="adminUsername"
placeholder="Username"
>

<input
type="password"
id="adminPassword"
placeholder="Password"
>

<button onclick="login()">
LOGIN
</button>

<p
id="loginMessage"
style="color:red;margin-top:15px;font-size:12px"
></p>

</div>

</div>


<!-- ADMIN PANEL -->

<div class="admin-panel" id="adminPanel">

<div class="admin-header">

<div class="admin-logo">
TRENDY FACTORY — ADMIN
</div>

<button
class="logout-btn"
onclick="logout()"
>
LOGOUT
</button>

</div>


<div class="admin-container">

<h1 class="admin-title">
Dashboard
</h1>


<!-- STATS -->

<div class="stats">

<div class="stat-card">

<span>TOTAL PRODUCTS</span>

<h2 id="totalProducts">
0
</h2>

</div>


<div class="stat-card">

<span>TOTAL ORDERS</span>

<h2 id="totalOrders">
0
</h2>

</div>


<div class="stat-card">

<span>PENDING ORDERS</span>

<h2 id="pendingOrders">
0
</h2>

</div>


<div class="stat-card">

<span>TOTAL SALES</span>

<h2>
₹<span id="totalSales">0</span>
</h2>

</div>

</div>


<!-- ADD PRODUCT -->

<div class="section-card">

<h2 id="formTitle">
Add New Product
</h2>


<div class="product-form">

<input
type="hidden"
id="editProductId"
>


<input
id="productName"
type="text"
placeholder="Product Name"
>


<input
id="productPrice"
type="number"
placeholder="Price"
>


<select id="productCategory">

<option value="">
Select Category
</option>

<option value="shirts">
Shirts
</option>

<option value="tshirts">
T-Shirts
</option>

<option value="pants">
Pants
</option>

<option value="jackets">
Jackets
</option>

</select>


<input
id="productSizes"
type="text"
placeholder="Sizes e.g. S,M,L,XL or 28,30,32,34"
>


<textarea
id="productDescription"
class="full-width"
placeholder="Product Description"
></textarea>


<button
class="form-btn full-width"
onclick="saveProduct()"
id="saveProductBtn"
>
ADD PRODUCT
</button>


<button
class="form-btn"
id="cancelEditBtn"
onclick="cancelEdit()"
style="display:none"
>
CANCEL EDIT
</button>


</div>

</div>


<!-- PRODUCT LIST -->

<div class="section-card">

<h2>
Manage Products
</h2>

<div
class="products-grid"
id="productsContainer"
></div>

</div>


<!-- ORDERS -->

<div class="section-card">

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:25px">

<h2 style="margin:0">
Customer Orders
</h2>

<button
class="form-btn"
onclick="loadOrders()"
>
REFRESH
</button>

</div>


<div id="ordersContainer"></div>

</div>


</div>

</div>


<script>

/* =========================
LOGIN
========================= */

const ADMIN_USERNAME = "admin";
const ADMIN_PASSWORD = "trendy123";


function login(){

const username =
document.getElementById("adminUsername").value.trim();

const password =
document.getElementById("adminPassword").value.trim();


if(
username === ADMIN_USERNAME &&
password === ADMIN_PASSWORD
){

localStorage.setItem(
"adminLoggedIn",
"true"
);

showAdmin();

}else{

document.getElementById(
"loginMessage"
).textContent =
"Invalid username or password.";

}

}


function showAdmin(){

document.getElementById(
"loginPage"
).style.display = "none";

document.getElementById(
"adminPanel"
).style.display = "block";

loadProducts();

loadOrders();

}


function logout(){

localStorage.removeItem(
"adminLoggedIn"
);

document.getElementById(
"adminPanel"
).style.display = "none";

document.getElementById(
"loginPage"
).style.display = "flex";

}


/* =========================
DEFAULT PRODUCTS
========================= */

const defaultProducts = [

{
id:1,
name:"Premium Linen Shirt",
price:1999,
category:"shirts",
image:"LINEN SHIRT",
description:"Premium breathable linen shirt.",
sizes:["S","M","L","XL","XXL"]
},

{
id:2,
name:"Oxford Classic Shirt",
price:2299,
category:"shirts",
image:"OXFORD SHIRT",
description:"Classic Oxford shirt.",
sizes:["S","M","L","XL","XXL"]
},

{
id:3,
name:"Oversized Essential T-Shirt",
price:1199,
category:"tshirts",
image:"OVERSIZED T-SHIRT",
description:"Heavyweight cotton t-shirt.",
sizes:["S","M","L","XL","XXL"]
},

{
id:4,
name:"Minimal Cotton T-Shirt",
price:999,
category:"tshirts",
image:"COTTON T-SHIRT",
description:"Soft cotton t-shirt.",
sizes:["S","M","L","XL","XXL"]
},

{
id:5,
name:"Relaxed Fit Trouser",
price:2499,
category:"pants",
image:"RELAXED TROUSER",
description:"Modern relaxed trousers.",
sizes:["28","30","32","34","36","38","40"]
},

{
id:6,
name:"Classic Straight Jeans",
price:2799,
category:"pants",
image:"STRAIGHT JEANS",
description:"Classic straight fit jeans.",
sizes:["28","30","32","34","36","38","40"]
},

{
id:7,
name:"Minimal Bomber Jacket",
price:3999,
category:"jackets",
image:"BOMBER JACKET",
description:"Modern bomber jacket.",
sizes:["S","M","L","XL","XXL"]
},

{
id:8,
name:"Classic Oversized Jacket",
price:4499,
category:"jackets",
image:"OVERSIZED JACKET",
description:"Premium oversized jacket.",
sizes:["S","M","L","XL","XXL"]
}

];


/* =========================
PRODUCT STORAGE
========================= */

let adminProducts = [];


function initializeProducts(){

try{

const savedProducts =
localStorage.getItem("trendyProducts");


if(savedProducts){

const parsedProducts =
JSON.parse(savedProducts);


if(
Array.isArray(parsedProducts) &&
parsedProducts.length > 0
){

adminProducts =
parsedProducts;

return;

}

}

}catch(error){

console.log(
"Product storage reset"
);

}


adminProducts =
[...defaultProducts];


localStorage.setItem(
"trendyProducts",
JSON.stringify(adminProducts)
);

}


/* =========================
LOAD PRODUCTS
========================= */

function loadProducts(){

const container =
document.getElementById(
"productsContainer"
);


if(!container){
return;
}


container.innerHTML = "";


if(
!Array.isArray(adminProducts) ||
adminProducts.length === 0
){

container.innerHTML =
'<div class="empty">No products found.</div>';

document.getElementById(
"totalProducts"
).textContent = "0";

return;

}


adminProducts.forEach(product => {

const sizes =
Array.isArray(product.sizes)
? product.sizes.join(", ")
: "";


container.innerHTML += `

<div class="admin-product">

<h3>
${product.name || "Unnamed Product"}
</h3>

<p>
<strong>
₹${product.price || 0}
</strong>
</p>

<p>
Category:
${product.category || ""}
</p>

<p>
Sizes:
${sizes}
</p>

<p>
${product.description || ""}
</p>

<div class="product-actions">

<button
class="edit-btn"
onclick="editProduct(${product.id})"
>
EDIT
</button>

<button
class="delete-btn"
onclick="deleteProduct(${product.id})"
>
DELETE
</button>

</div>

</div>

`;

});


document.getElementById(
"totalProducts"
).textContent =
adminProducts.length;

}


/* =========================
SAVE PRODUCT
========================= */

function saveProduct(){

const id =
document.getElementById(
"editProductId"
).value;


const name =
document.getElementById(
"productName"
).value.trim();


const priceValue =
document.getElementById(
"productPrice"
).value;


const price =
Number(priceValue);


const category =
document.getElementById(
"productCategory"
).value;


const sizesText =
document.getElementById(
"productSizes"
).value.trim();


const description =
document.getElementById(
"productDescription"
).value.trim();


if(!name){

alert(
"Please enter product name."
);

return;

}


if(!price || price <= 0){

alert(
"Please enter valid price."
);

return;

}


if(!category){

alert(
"Please select category."
);

return;

}


if(!sizesText){

alert(
"Please enter product sizes."
);

return;

}


if(!description){

alert(
"Please enter product description."
);

return;

}


const sizes =
sizesText
.split(",")
.map(size => size.trim())
.filter(size => size);


if(sizes.length === 0){

alert(
"Please enter valid sizes."
);

return;

}


/* EDIT */

if(id){

const index =
adminProducts.findIndex(
product =>
String(product.id) === String(id)
);


if(index !== -1){

adminProducts[index] = {

...adminProducts[index],

name:name,
price:price,
category:category,
sizes:sizes,
description:description,

image:
adminProducts[index].image ||
name

};


alert(
"Product updated successfully!"
);

}


cancelEdit();


}else{


/* ADD */

const newProduct = {

id:Date.now(),

name:name,

price:price,

category:category,

image:name,

sizes:sizes,

description:description

};


adminProducts.push(
newProduct
);


clearForm();


alert(
"Product added successfully!"
);

}


/* SAVE */

localStorage.setItem(
"trendyProducts",
JSON.stringify(adminProducts)
);


loadProducts();

}


/* =========================
EDIT PRODUCT
========================= */

function editProduct(id){

const product =
adminProducts.find(
product =>
String(product.id) === String(id)
);


if(!product){
return;
}


document.getElementById(
"editProductId"
).value =
product.id;


document.getElementById(
"productName"
).value =
product.name || "";


document.getElementById(
"productPrice"
).value =
product.price || "";


document.getElementById(
"productCategory"
).value =
product.category || "";


document.getElementById(
"productSizes"
).value =
Array.isArray(product.sizes)
? product.sizes.join(",")
: "";


document.getElementById(
"productDescription"
).value =
product.description || "";


document.getElementById(
"formTitle"
).textContent =
"Edit Product";


document.getElementById(
"saveProductBtn"
).textContent =
"UPDATE PRODUCT";


document.getElementById(
"cancelEditBtn"
).style.display =
"block";


window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* =========================
CANCEL EDIT
========================= */

function cancelEdit(){

clearForm();


document.getElementById(
"formTitle"
).textContent =
"Add New Product";


document.getElementById(
"saveProductBtn"
).textContent =
"ADD PRODUCT";


document.getElementById(
"cancelEditBtn"
).style.display =
"none";

}


/* =========================
CLEAR FORM
========================= */

function clearForm(){

document.getElementById(
"editProductId"
).value = "";


document.getElementById(
"productName"
).value = "";


document.getElementById(
"productPrice"
).value = "";


document.getElementById(
"productCategory"
).value = "";


document.getElementById(
"productSizes"
).value = "";


document.getElementById(
"productDescription"
).value = "";

}


/* =========================
DELETE PRODUCT
========================= */

function deleteProduct(id){

const confirmDelete =
confirm(
"Delete this product?"
);


if(!confirmDelete){
return;
}


adminProducts =
adminProducts.filter(
product =>
String(product.id) !== String(id)
);


localStorage.setItem(
"trendyProducts",
JSON.stringify(adminProducts)
);


loadProducts();

}


/* =========================
ORDERS
========================= */

function loadOrders(){

const container =
document.getElementById(
"ordersContainer"
);


if(!container){
return;
}


let orders = [];


try{

const latestOrder =
JSON.parse(
localStorage.getItem(
"latestOrder"
) || "null"
);


if(latestOrder){

orders.push(
latestOrder
);

}

}catch(error){

orders = [];

}


document.getElementById(
"totalOrders"
).textContent =
orders.length;


const pending =
orders.filter(
order =>
!order.status ||
order.status === "Pending"
).length;


document.getElementById(
"pendingOrders"
).textContent =
pending;


const sales =
orders.reduce(
(sum,order) =>
sum + Number(order.total || 0),
0
);


document.getElementById(
"totalSales"
).textContent =
sales;


container.innerHTML = "";


if(orders.length === 0){

container.innerHTML =
'<div class="empty">No orders yet.</div>';

return;

}


orders.forEach(order => {

const status =
order.status || "Pending";


const items =
Array.isArray(order.items)
? order.items
: [];


const itemsHTML =
items.map(item => `

<div class="product-line">

<span>

${item.name || ""}

<br>

<small>
Size:
${item.size || ""}
</small>

</span>

<strong>
₹${item.price || 0}
</strong>

</div>

`).join("");


const customer =
order.customer || {};


container.innerHTML += `

<div class="order-card">

<div class="order-top">

<div>

<div class="order-id">

Order:
${order.id || "N/A"}

</div>

<div class="order-date">

${order.date
? new Date(order.date).toLocaleString()
: ""}

</div>

</div>


<select
class="order-status"
onchange="updateStatus(this.value)"
>

<option
${status === "Pending" ? "selected" : ""}
>
Pending
</option>

<option
${status === "Confirmed" ? "selected" : ""}
>
Confirmed
</option>

<option
${status === "Shipped" ? "selected" : ""}
>
Shipped
</option>

<option
${status === "Delivered" ? "selected" : ""}
>
Delivered
</option>

<option
${status === "Cancelled" ? "selected" : ""}
>
Cancelled
</option>

</select>

</div>


<div class="order-grid">

<div class="order-info">

<h4>
CUSTOMER DETAILS
</h4>

<p>

<strong>
${customer.name || ""}
</strong>

<br>

${customer.phone || ""}

<br>

${customer.email || ""}

</p>

</div>


<div class="order-info">

<h4>
DELIVERY ADDRESS
</h4>

<p>

${customer.address || ""}

<br>

${customer.city || ""},
${customer.state || ""}

<br>

PIN:
${customer.pin || ""}

</p>

</div>

</div>


<div class="order-items">

<h4>
ORDER ITEMS
</h4>

${itemsHTML}

</div>


<div class="order-total">

<span>
Final Total
</span>

<strong>
₹${order.total || 0}
</strong>

</div>


<button
class="delete-order"
onclick="deleteOrder()"
>
DELETE ORDER
</button>

</div>

`;

});

}


/* =========================
ORDER STATUS
========================= */

function updateStatus(status){

try{

const latestOrder =
JSON.parse(
localStorage.getItem(
"latestOrder"
) || "null"
);


if(latestOrder){

latestOrder.status =
status;


localStorage.setItem(
"latestOrder",
JSON.stringify(latestOrder)
);

}

}catch(error){

console.log(
"Order update failed"
);

}


loadOrders();

}


/* =========================
DELETE ORDER
========================= */

function deleteOrder(){

const confirmed =
confirm(
"Are you sure you want to delete this order?"
);


if(!confirmed){
return;
}


localStorage.removeItem(
"latestOrder"
);


loadOrders();

}


/* =========================
START APP
========================= */

initializeProducts();


if(
localStorage.getItem(
"adminLoggedIn"
) === "true"
){

showAdmin();

}

</script>

</body>
 </html>
