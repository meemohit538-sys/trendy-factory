<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRENDY FACTORY — Men's Fashion</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f0e8;
  color:#211e1a;
}

header{
  height:70px;
  background:#fbf8f3;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 6%;
  border-bottom:1px solid #ddd5ca;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  font-size:18px;
  letter-spacing:3px;
  font-weight:bold;
}

nav{
  display:flex;
  gap:15px;
  align-items:center;
}

nav a,nav button{
  border:none;
  background:none;
  color:#211e1a;
  text-decoration:none;
  font-size:10px;
  letter-spacing:1px;
  cursor:pointer;
}

.hero{
  min-height:72vh;
  padding:8% 7%;
  display:flex;
  align-items:flex-end;
  background:linear-gradient(120deg,#b8a58f,#dfd2c2);
}

.hero p{
  font-size:11px;
  letter-spacing:3px;
  margin-bottom:20px;
}

.hero h1{
  font-family:Georgia,serif;
  font-weight:400;
  font-size:clamp(55px,10vw,125px);
  line-height:.9;
  margin-bottom:28px;
}

.btn{
  background:#211e1a;
  color:white;
  padding:15px 25px;
  border:none;
  cursor:pointer;
  text-decoration:none;
  display:inline-block;
  font-size:11px;
  letter-spacing:1px;
}

.section{
  padding:70px 6%;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}

.section h2{
  font-family:Georgia,serif;
  font-size:40px;
  font-weight:400;
}

.filters{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:30px;
}

.filter-btn{
  background:transparent;
  border:1px solid #211e1a;
  padding:10px 16px;
  font-size:10px;
  cursor:pointer;
  letter-spacing:1px;
}

.filter-btn.active,
.filter-btn:hover{
  background:#211e1a;
  color:white;
}

.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

.product{
  background:#fffaf4;
  cursor:pointer;
  transition:.25s;
}

.product:hover{
  transform:translateY(-5px);
}

.product-image{
  height:330px;
  background:#ddd0c0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  letter-spacing:2px;
  color:#66594d;
}

.product-info{
  padding:15px;
}

.product-info h3{
  font-size:14px;
  font-weight:500;
  margin-bottom:8px;
}

.product-info p{
  font-size:13px;
  color:#625a52;
}

.banner{
  background:#29241f;
  color:#f5f0e8;
  text-align:center;
  padding:90px 8%;
}

.banner p{
  font-size:11px;
  letter-spacing:3px;
  margin-bottom:20px;
}

.banner h2{
  font-family:Georgia,serif;
  font-size:clamp(38px,7vw,80px);
  font-weight:400;
}

/* PRODUCT MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  z-index:900;
  align-items:center;
  justify-content:center;
}

.modal.active{
  display:flex;
}

.modal-content{
  width:900px;
  max-width:94%;
  max-height:90vh;
  overflow:auto;
  background:#fbf8f3;
  display:grid;
  grid-template-columns:1fr 1fr;
  position:relative;
}

.modal-image{
  min-height:520px;
  background:#d8c9b8;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  letter-spacing:2px;
}

.modal-info{
  padding:45px;
}

.modal-info h2{
  font-family:Georgia,serif;
  font-size:36px;
  font-weight:400;
  margin-bottom:15px;
}

.modal-price{
  font-size:18px;
  margin-bottom:25px;
}

.description{
  color:#655d55;
  font-size:14px;
  line-height:1.6;
  margin-bottom:28px;
}

.label{
  display:block;
  font-size:10px;
  letter-spacing:1px;
  margin-bottom:12px;
}

.sizes{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:25px;
}

.size-btn{
  min-width:45px;
  height:40px;
  padding:0 10px;
  background:transparent;
  border:1px solid #aaa;
  cursor:pointer;
}

.size-btn.active{
  background:#211e1a;
  color:white;
}

.quantity{
  display:flex;
  align-items:center;
  gap:18px;
  margin-bottom:25px;
}

.quantity button{
  width:38px;
  height:38px;
  border:1px solid #aaa;
  background:white;
  cursor:pointer;
}

.modal-close{
  position:absolute;
  right:15px;
  top:10px;
  border:none;
  background:none;
  font-size:28px;
  cursor:pointer;
}

/* CART */

.cart-panel{
  position:fixed;
  top:0;
  right:-420px;
  width:380px;
  max-width:100%;
  height:100vh;
  background:#fbf8f3;
  z-index:1000;
  padding:25px;
  transition:.35s;
  overflow:auto;
  box-shadow:-5px 0 20px rgba(0,0,0,.15);
}

.cart-panel.active{
  right:0;
}

.cart-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding-bottom:18px;
  border-bottom:1px solid #ddd;
}

.close{
  border:none;
  background:none;
  font-size:26px;
  cursor:pointer;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  padding:18px 0;
  border-bottom:1px solid #ddd;
  font-size:13px;
}

.remove{
  border:none;
  background:none;
  text-decoration:underline;
  cursor:pointer;
  font-size:10px;
}

.cart-total{
  padding:20px 0;
  font-size:18px;
}

.checkout-btn{
  width:100%;
  padding:16px;
  border:none;
  background:#211e1a;
  color:white;
  cursor:pointer;
  letter-spacing:1px;
}

footer{
  background:#e6ddd2;
  padding:45px 6%;
  text-align:center;
  font-size:11px;
}

@media(max-width:800px){

  header{padding:0 5%}

  nav{gap:9px}

  nav a,nav button{
    font-size:8px;
  }

  .section{
    padding:55px 5%;
  }

  .section h2{
    font-size:31px;
  }

  .products{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .product-image{
    height:230px;
  }

  .modal-content{
    grid-template-columns:1fr;
  }

  .modal-image{
    min-height:280px;
  }

  .modal-info{
    padding:30px 20px;
  }
}
</style>
</head>

<body>

<header>

<div class="logo">TRENDY FACTORY</div>

<nav>
<a href="#shop">SHOP</a>
<a href="#shop">NEW</a>
<button onclick="openCart()">
BAG (<span id="cartCount">0</span>)
</button>
</nav>

</header>

<section class="hero">

<div>
<p>MEN'S COLLECTION · 2026</p>

<h1>
Modern.<br>
Everyday.
</h1>

<a href="#shop" class="btn">SHOP MEN'S COLLECTION</a>
</div>

</section>

<section class="section" id="shop">

<div class="section-title">
<h2>Men's Collection</h2>
</div>

<div class="filters">

<button class="filter-btn active" onclick="filterProducts('all',this)">ALL</button>

<button class="filter-btn" onclick="filterProducts('shirts',this)">SHIRTS</button>

<button class="filter-btn" onclick="filterProducts('tshirts',this)">T-SHIRTS</button>

<button class="filter-btn" onclick="filterProducts('pants',this)">PANTS</button>

<button class="filter-btn" onclick="filterProducts('jackets',this)">JACKETS</button>

</div>

<div class="products" id="productsContainer"></div>

</section>

<section class="banner">

<p>TRENDY FACTORY MEN</p>

<h2>
Built for the<br>
modern wardrobe.
</h2>

</section>

<footer>
© 2026 TRENDY FACTORY · ALL RIGHTS RESERVED
</footer>


<!-- PRODUCT MODAL -->

<div class="modal" id="productModal">

<div class="modal-content">

<button class="modal-close" onclick="closeProduct()">×</button>

<div class="modal-image" id="modalImage">
PRODUCT
</div>

<div class="modal-info">

<h2 id="modalTitle"></h2>

<div class="modal-price">
₹<span id="modalPrice"></span>
</div>

<p class="description" id="modalDescription"></p>

<span class="label">SELECT SIZE</span>

<div class="sizes" id="sizeContainer"></div>

<span class="label">QUANTITY</span>

<div class="quantity">

<button onclick="changeQty(-1)">−</button>

<span id="quantity">1</span>

<button onclick="changeQty(1)">+</button>

</div>

<button class="btn" onclick="addSelectedProduct()">
ADD TO BAG
</button>

</div>

</div>

</div>


<!-- CART -->

<div class="cart-panel" id="cartPanel">

<div class="cart-header">

<h2>Your Bag</h2>

<button class="close" onclick="closeCart()">×</button>

</div>

<div id="cartItems"></div>

<div class="cart-total">
<strong>Total: ₹<span id="cartTotal">0</span></strong>
</div>

<button class="checkout-btn" onclick="checkout()">
PROCEED TO CHECKOUT
</button>

</div>


<script>

const products = [

{
id:1,
name:"Premium Linen Shirt",
price:1999,
category:"shirts",
image:"LINEN SHIRT",
description:"Premium breathable linen shirt with a clean modern fit.",
sizes:["S","M","L","XL","XXL"]
},

{
id:2,
name:"Oxford Classic Shirt",
price:2299,
category:"shirts",
image:"OXFORD SHIRT",
description:"Classic Oxford shirt designed for everyday and formal styling.",
sizes:["S","M","L","XL","XXL"]
},

{
id:3,
name:"Oversized Essential T-Shirt",
price:1199,
category:"tshirts",
image:"OVERSIZED T-SHIRT",
description:"Heavyweight cotton oversized t-shirt with a relaxed silhouette.",
sizes:["S","M","L","XL","XXL"]
},

{
id:4,
name:"Minimal Cotton T-Shirt",
price:999,
category:"tshirts",
image:"COTTON T-SHIRT",
description:"Soft premium cotton t-shirt for everyday comfort.",
sizes:["S","M","L","XL","XXL"]
},

{
id:5,
name:"Relaxed Fit Trouser",
price:2499,
category:"pants",
image:"RELAXED TROUSER",
description:"Modern relaxed fit trousers with comfortable everyday tailoring.",
sizes:["28","30","32","34","36","38","40"]
},

{
id:6,
name:"Classic Straight Jeans",
price:2799,
category:"pants",
image:"STRAIGHT JEANS",
description:"Classic straight fit jeans designed for timeless everyday style.",
sizes:["28","30","32","34","36","38","40"]
},

{
id:7,
name:"Minimal Bomber Jacket",
price:3999,
category:"jackets",
image:"BOMBER JACKET",
description:"Clean minimal bomber jacket for a refined modern look.",
sizes:["S","M","L","XL","XXL"]
},

{
id:8,
name:"Classic Oversized Jacket",
price:4499,
category:"jackets",
image:"OVERSIZED JACKET",
description:"Premium oversized jacket with a contemporary relaxed fit.",
sizes:["S","M","L","XL","XXL"]
}

];

let cart = JSON.parse(localStorage.getItem("trendyCart")) || [];

let currentProduct = null;
let selectedSize = "";
let qty = 1;


/* DISPLAY PRODUCTS */

function displayProducts(category="all"){

const container=document.getElementById("productsContainer");

container.innerHTML="";

const filtered=category==="all"
?products
:products.filter(p=>p.category===category);

filtered.forEach(product=>{

container.innerHTML+=`

<div class="product" onclick="openProduct(${product.id})">

<div class="product-image">
${product.image}
</div>

<div class="product-info">

<h3>${product.name}</h3>

<p>₹${product.price}</p>

</div>

</div>

`;

});

}


/* FILTER */

function filterProducts(category,button){

document.querySelectorAll(".filter-btn").forEach(btn=>{
btn.classList.remove("active");
});

button.classList.add("active");

displayProducts(category);

}


/* PRODUCT MODAL */

function openProduct(id){

currentProduct=products.find(p=>p.id===id);

document.getElementById("modalTitle").textContent=currentProduct.name;

document.getElementById("modalPrice").textContent=currentProduct.price;

document.getElementById("modalDescription").textContent=currentProduct.description;

document.getElementById("modalImage").textContent=currentProduct.image;

const sizeContainer=document.getElementById("sizeContainer");

sizeContainer.innerHTML="";

currentProduct.sizes.forEach((size,index)=>{

const button=document.createElement("button");

button.className="size-btn";

button.textContent=size;

button.onclick=function(){
selectSize(this,size);
};

if(index===0){

button.classList.add("active");

selectedSize=size;

}

sizeContainer.appendChild(button);

});

qty=1;

document.getElementById("quantity").textContent=qty;

document.getElementById("productModal").classList.add("active");

}


function closeProduct(){

document.getElementById("productModal").classList.remove("active");

}


/* SIZE */

function selectSize(button,size){

selectedSize=size;

document.querySelectorAll(".size-btn").forEach(btn=>{
btn.classList.remove("active");
});

button.classList.add("active");

}


/* QUANTITY */

function changeQty(change){

qty+=change;

if(qty<1)qty=1;

document.getElementById("quantity").textContent=qty;

}


/* ADD TO BAG */

function addSelectedProduct(){

for(let i=0;i<qty;i++){

cart.push({

name:currentProduct.name,

price:currentProduct.price,

size:selectedSize

});

}

saveCart();

closeProduct();

openCart();

}


/* CART */

function saveCart(){

localStorage.setItem("trendyCart",JSON.stringify(cart));

updateCart();

}


function updateCart(){

document.getElementById("cartCount").textContent=cart.length;

const items=document.getElementById("cartItems");

items.innerHTML="";

let total=0;

cart.forEach((item,index)=>{

total+=item.price;

items.innerHTML+=`

<div class="cart-item">

<div>

<strong>${item.name}</strong><br>

Size: ${item.size}<br>

₹${item.price}

</div>

<button class="remove" onclick="removeItem(${index})">

REMOVE

</button>

</div>

`;

});

document.getElementById("cartTotal").textContent=total;

}


function removeItem(index){

cart.splice(index,1);

saveCart();

}


function openCart(){

document.getElementById("cartPanel").classList.add("active");

}


function closeCart(){

document.getElementById("cartPanel").classList.remove("active");

}


/* CHECKOUT */

function checkout(){

if(cart.length===0){

alert("Your bag is empty!");

return;

}

alert("Checkout system will be added in the next update.");

}


displayProducts();

updateCart();

</script>

</body>
  </html>
