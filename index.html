<!DOCTYPE html>

<style>

/* ================= RESET ================= */

    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;

button,
input,
textarea,

/* ================= HEADER ================= */

header{

.logo{

.cart-btn{

.cart-count{

    height:21px;

/* ================= HERO ================= */

.hero{

}

.hero-content{

}

.hero h1{

}

.hero p{

}

.shop-now{

    background:#d97b36;
    color:white;
    text-decoration:none;
    font-weight:bold;
    border-radius:6px;
}

/* ================= SEARCH ================= */

.search-section{
    max-width:1200px;
    margin:auto;
    padding:35px 5% 20px;
}

.search-box{
    width:100%;
    padding:15px;

    border-radius:8px;

}

.search-box:focus{

}

/* ================= FILTERS ================= */

.filters{
    max-width:1200px;
    margin:auto;
    padding:0 5% 30px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.filter-btn{

    border-radius:25px;

}

.filter-btn.active,

}

/* ================= PRODUCTS ================= */

.products-section{
    max-width:1300px;
    margin:auto;
    padding:20px 5% 80px;
}

.section-title{
    text-align:center;
    font-size:30px;
    letter-spacing:2px;

}

.product-grid{

.loading,

/* ================= PRODUCT CARD ================= */

.product-card{
    background:white;
    border-radius:12px;

}

.product-card:hover{

}

.product-image{

    justify-content:center;
}

.product-image img{

}

.product-info{

.product-price{

.stock-text{

    font-weight:bold;
}

.in-stock{

}

.out-stock{

}

/* ================= MODAL ================= */

.modal{

    inset:0;
    background:rgba(0,0,0,0.65);

    padding:20px;

}

.modal.active{

.modal-content{

    border-radius:14px;

}

.close-modal{

    font-size:30px;

}

.modal-image{

}

.modal-image > img{

}

#productImageGallery{

    flex-wrap:wrap;

    background:white;
}

#productImageGallery img{
    width:65px;

}

.modal-details{
    padding-top:20px;
}

.modal-details h2{
    font-size:28px;
    margin-bottom:10px;
}

.modal-price{
    font-size:24px;
    font-weight:bold;

    margin-bottom:15px;
}

.modal-description{
    color:#655d55;
    margin-bottom:20px;
}

/* ================= SIZE ================= */

.size-label{

}

.size-options{

}

.size-btn.active{

/* ================= QUANTITY ================= */

.quantity-row{

}

.quantity-controls{

}

.quantity-controls button{

/* ================= BUTTONS ================= */

.primary-btn{

    background:#211e1a;

}

.secondary-btn{

    border-radius:7px;
}

/* ================= CART ================= */

.cart-panel{

    top:0;

}

.cart-panel.active{

}

.cart-header{

}

.cart-close{

}

.cart-items{

}

.cart-item{

}

.cart-item img{

.cart-item-name{

.cart-item-details{

.cart-item-price{

.cart-total{

.form-group{

.form-group label{

.coupon-message{

.summary-row{

.summary-total{

/* ================= SUCCESS ================= */

.success-page{

.success-page.active{

.success-icon{

}

/* ================= WHATSAPP ================= */

.whatsapp-float{

/* ================= MOBILE ================= */

@media(max-width:800px){

</style>

<!-- ================= FIREBASE + JAVASCRIPT ================= -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs,
    addDoc,
    serverTimestamp,
    doc,
    runTransaction
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* ================= FIREBASE CONFIG ================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyCZjafz8Ze5p6xSoir4j5IdKc_MJE_Eyns",

    authDomain:
        "trendy-factory.firebaseapp.com",

    projectId:
        "trendy-factory",

    storageBucket:
        "trendy-factory.firebasestorage.app",

    messagingSenderId:
        "811817163762",

    appId:
        "1:811817163762:web:c9aecc5db2cb332a13696b",

    measurementId:
        "G-8YDMBE9T7C"

};


/* ================= INITIALIZE FIREBASE ================= */

const app =
    initializeApp(firebaseConfig);

const db =
    getFirestore(app);


/* ================= GLOBAL VARIABLES ================= */

let products = [];

let filteredProducts = [];

let selectedCategory = "all";

let currentProduct = null;

let selectedSize = "";

let modalQuantity = 1;

let appliedCoupon = null;

let cart = [];


/* ================= LOAD CART ================= */

try{

    cart =
        JSON.parse(
            localStorage.getItem(
                "trendyFactoryCart"
            )
        ) || [];

}catch(error){

    cart = [];

}


/* ================= ESCAPE HTML ================= */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ================= IMAGE URL ================= */

function getImageUrl(product){

    const images =
        Array.isArray(product.images)
            ? product.images
            : [];

    for(const image of images){

        if(typeof image === "string" && image.trim()){

            return image.trim();

        }

        if(
            image &&
            typeof image === "object" &&
            typeof image.url === "string" &&
            image.url.trim()
        ){

            return image.url.trim();

        }

    }

    if(
        typeof product.image === "string" &&
        product.image.trim()
    ){

        return product.image.trim();

    }

    if(
        typeof product.imageUrl === "string" &&
        product.imageUrl.trim()
    ){

        return product.imageUrl.trim();

    }

    return "";

}


/* ================= LOAD PRODUCTS ================= */

async function loadProducts(){

    const grid =
        document.getElementById("productGrid");

    if(grid){

        grid.innerHTML =
            '<div class="loading">Loading products...</div>';

    }

    try{

        const snapshot =
            await getDocs(
                collection(db,"products")
            );

        products =
            snapshot.docs.map(function(item){

                return {

                    id:item.id,

                    ...item.data()

                };

            });

        filteredProducts =
            [...products];

        renderProducts();

    }catch(error){

        console.error(
            "Product loading error:",
            error
        );

        if(grid){

            grid.innerHTML = `
                <div class="empty-state">
                    <h3>Unable to load products</h3>
                    <p>Please try again later.</p>
                </div>
            `;

        }

    }

}


/* ================= RENDER PRODUCTS ================= */

function renderProducts(){

    const grid =
        document.getElementById("productGrid");

    if(!grid){

        return;

    }

    if(!filteredProducts.length){

        grid.innerHTML = `
            <div class="empty-state">
                <h3>No products found</h3>
                <p>Try another search or category.</p>
            </div>
        `;

        return;

    }

    grid.innerHTML =
        filteredProducts.map(function(product){

            const stock =
                Number(product.stock || 0);

            const image =
                getImageUrl(product);

            const imageHtml =
                image
                    ? `
                        <img
                            src="${escapeHtml(image)}"
                            alt="${escapeHtml(product.name || "Product")}"
                            loading="lazy"
                        >
                    `
                    : `
                        <div style="
                            width:100%;
                            height:100%;
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            color:#777;
                        ">
                            No Image
                        </div>
                    `;

            return `

                <div
                    class="product-card"
                    onclick="openProduct('${String(product.id).replace(/'/g,"\\'")}')"
                >

                    <div class="product-image">

                        ${imageHtml}

                    </div>

                    <div class="product-info">

                        <h3>
                            ${escapeHtml(
                                product.name || "Unnamed Product"
                            )}
                        </h3>

                        <div class="product-price">
                            ₹${Number(product.price || 0)}
                        </div>

                        <div class="stock-text ${
                            stock > 0
                                ? "in-stock"
                                : "out-stock"
                        }">

                            ${
                                stock > 0
                                    ? "IN STOCK"
                                    : "OUT OF STOCK"
                            }

                        </div>

                    </div>

                </div>

            `;

        }).join("");

}


/* ================= CATEGORY FILTER ================= */

window.setCategory =
function(category,button){

    selectedCategory =
 category;

    document
        .querySelectorAll(".filter-btn")
        .forEach(function(item){

            item.classList.remove("active");

        });

    if(button){

        button.classList.add("active");

    }

    filterProducts();

};


/* ================= SEARCH FILTER ================= */

window.filterProducts =
function(){

    const searchInput =
        document.getElementById("searchInput");

    const search =
        String(
            searchInput?.value || ""
        )
        .trim()
        .toLowerCase();


    filteredProducts =
        products.filter(function(product){

            const name =
                String(
                    product.name || ""
                ).toLowerCase();

            const category =
                String(
                    product.category || ""
                ).toLowerCase();

            const matchesSearch =
                !search ||
                name.includes(search) ||
                category.includes(search);

            let matchesCategory = true;

            if(selectedCategory !== "all"){

                matchesCategory =
                    category.includes(
                        selectedCategory
                    );

            }

            return (
                matchesSearch &&
                matchesCategory
            );

        });


    renderProducts();

};

/* ================= OPEN PRODUCT ================= */

window.openProduct = function(id){

    currentProduct =
        products.find(function(product){

            return product.id === id;

        });


    if(!currentProduct){

        return;

    }


    const images =
        (currentProduct.images || [])
        .map(function(img){

            if(typeof img === "string"){

                return img;

            }

            if(
                img &&
                typeof img.url === "string"
            ){

                return img.url;

            }

            return "";

        })
        .filter(Boolean);


    if(
        !images.length &&
        currentProduct.image
    ){

        images.push(
            currentProduct.image
        );

    }


    if(
        !images.length &&
        currentProduct.imageUrl
    ){

        images.push(
            currentProduct.imageUrl
        );

    }


    const mainImage =
        document.getElementById(
            "modalProductImage"
        );


    const gallery =
        document.getElementById(
            "productImageGallery"
        );


    if(images.length){

        mainImage.src =
            images[0];

        mainImage.alt =
            currentProduct.name ||
            "Product";


    }else{

        mainImage.removeAttribute("src");

        mainImage.alt =
            "No product image";

    }


    gallery.innerHTML =
        images.map(function(image,index){

            return `

                <img
                    src="${escapeHtml(image)}"
                    alt="Product image ${index + 1}"
                    onclick="changeMainImage('${String(image).replace(/'/g,"\\'")}')"
                >

            `;

        }).join("");


    document.getElementById(
        "modalProductName"
    ).textContent =
        currentProduct.name ||
        "Product";


    document.getElementById(
        "modalProductPrice"
    ).textContent =
        "₹" +
        Number(
            currentProduct.price || 0
        );


    document.getElementById(
        "modalProductDescription"
    ).textContent =
        currentProduct.description ||
        "No description available.";


    selectedSize = "";

    modalQuantity = 1;


    document.getElementById(
        "modalQuantity"
    ).textContent =
        "1";


    renderSizes();


    document.getElementById(
        "productModal"
    ).classList.add("active");

};

function renderSizes(){

    const container =
        document.getElementById(
            "sizeOptions"
        );

    if(!container){

        return;

    }


    let sizes =
        currentProduct &&
        currentProduct.sizes;


    if(typeof sizes === "string"){

        sizes =
            sizes
                .split(",")
                .map(function(size){

                    return size.trim();

                })
                .filter(Boolean);

    }


    if(!Array.isArray(sizes) || !sizes.length){

        sizes = [
            "S",
            "M",
            "L",
            "XL"
        ];

    }


    container.innerHTML =
        sizes.map(function(size){

            const safeSize =
                escapeHtml(size);

            const active =
                String(selectedSize) ===
                String(size)
                    ? "active"
                    : "";

            return `

                <button
                    type="button"
                    class="size-btn ${active}"
                    onclick="selectSize('${String(size).replace(/'/g,"\\'")}')"
                >
                    ${safeSize}
                </button>

            `;

        }).join("");

}

/* ================= CHANGE MODAL QUANTITY ================= */

window.changeModalQuantity =
function(change){

    if(!currentProduct){

        return;

    }


    const stock =
        Number(
            currentProduct.stock || 0
        );


    let nextQuantity =
        modalQuantity +
        Number(change);


    if(nextQuantity < 1){

        nextQuantity = 1;

    }


    if(stock > 0 && nextQuantity > stock){

        nextQuantity = stock;

    }


    modalQuantity =
        nextQuantity;


    const quantityElement =
        document.getElementById(
            "modalQuantity"
        );


    if(quantityElement){

        quantityElement.textContent =
            String(modalQuantity);

    }

};

/* ================= ADD TO CART ================= */

window.addCurrentProductToCart =
function(){

    if(!currentProduct){

        return;

    }


    const stock =
        Number(
            currentProduct.stock || 0
        );


    if(stock <= 0){

        alert(
            "This product is currently out of stock."
        );

        return;

    }


    if(!selectedSize){

        alert(
            "Please select a size."
        );

        return;

    }


    const existingIndex =
        cart.findIndex(function(item){

            return (
                item.productId ===
                currentProduct.id &&
                String(item.size) ===
                String(selectedSize)
            );

        });


    if(existingIndex >= 0){

        const newQuantity =
            Number(
                cart[existingIndex].quantity || 0
            ) +
            modalQuantity;


        if(newQuantity > stock){

            alert(
                "Only " +
                stock +
                " item(s) available."
            );

            return;

        }


        cart[existingIndex].quantity =
            newQuantity;

    }else{

        cart.push({

            productId:
                currentProduct.id,

            name:
                currentProduct.name ||
                "Product",

            price:
                Number(
                    currentProduct.price || 0
                ),

            image:
                getImageUrl(currentProduct),

            size:
                selectedSize,

            quantity:
                modalQuantity

        });

    }


    saveCart();

    updateCart();

    closeProductModal();

    alert(
        "Product added to your bag."
    );

};


/* ================= UPDATE CART ================= */

window.updateCart =
function(){

    const countElement =
        document.getElementById(
            "cartCount"
        );


    const totalQuantity =
        cart.reduce(function(total,item){

            return total +
                Number(
                    item.quantity || 0
                );

        },0);


    if(countElement){

        countElement.textContent =
            String(totalQuantity);

    }


    renderCart();

};


/* ================= CART SUBTOTAL ================= */

function getCartSubtotal(){

    return cart.reduce(
        function(total,item){

            return total +
                (
                    Number(
                        item.price || 0
                    ) *
                    Number(
                        item.quantity || 0
                    )
                );

        },
        0
    );

}

/* ================= APPLY COUPON ================= */

window.applyCoupon =
function(){

    const input =
        document.getElementById(
            "couponInput"
        );


    const message =
        document.getElementById(
            "couponMessage"
        );


    if(!input || !message){

        return;

    }


    const code =
        String(
            input.value || ""
        )
        .trim()
        .toUpperCase();


    if(!code){

        appliedCoupon = null;

        message.textContent =
            "Please enter a coupon code.";

        updateCheckoutTotals();

        return;

    }


    if(code === "TRENDY10"){

        appliedCoupon = {

            code:"TRENDY10",

            percent:10

        };


        message.textContent =
            "Coupon applied: 10% discount.";

        message.style.color =
            "#16803d";

    }else{

        appliedCoupon = null;

        message.textContent =
            "Invalid coupon code.";

        message.style.color =
            "#b3261e";

    }


    updateCheckoutTotals();

};


/* ================= CHECKOUT TOTALS ================= */

function updateCheckoutTotals(){

    const subtotal =
        getCartSubtotal();


    let discount = 0;


    if(appliedCoupon){

        discount =
            Math.round(
                subtotal *
                (
                    appliedCoupon.percent /
                    100
                )
            );

    }


    const total =
        Math.max(
            0,
            subtotal - discount
        );


    const subtotalElement =
        document.getElementById(
            "checkoutSubtotal"
        );


    const discountRow =
        document.getElementById(
            "discountRow"
        );


    const discountElement =
        document.getElementById(
            "checkoutDiscount"
        );


    const totalElement =
        document.getElementById(
            "checkoutTotal"
        );


    if(subtotalElement){

        subtotalElement.textContent =
            "₹" +
            subtotal;

    }


    if(discountRow){

        discountRow.style.display =
            discount > 0
                ? "flex"
                : "none";

    }


    if(discountElement){

        discountElement.textContent =
            "-₹" +
            discount;

    }


    if(totalElement){

        totalElement.textContent =
            "₹" +
            total;

    }

 }
 /* ================= PLACE ORDER ================= */

window.placeOrder =
async function(){

    if(!cart.length){

        alert(
            "Your bag is empty."
        );

        return;

    }


    const name =
        document.getElementById(
            "customerName"
        )?.value.trim();


    const phone =
        document.getElementById(
            "customerPhone"
        )?.value.trim();


    const email =
        document.getElementById(
            "customerEmail"
        )?.value.trim();


    const address =
        document.getElementById(
            "customerAddress"
        )?.value.trim();


    const paymentMethod =
        document.getElementById(
            "paymentMethod"
        )?.value;


    if(!name){

        alert(
            "Please enter your name."
        );

        return;

    }


    if(!/^[0-9]{10}$/.test(phone)){

        alert(
            "Please enter a valid 10 digit mobile number."
        );

        return;

    }


    if(!address){

        alert(
            "Please enter your full address."
        );

        return;

    }


    if(!paymentMethod){

        alert(
            "Please select a payment method."
        );

        return;

    }


    const subtotal =
        getCartSubtotal();


    let discount = 0;


    if(appliedCoupon){

        discount =
            Math.round(
                subtotal *
                (
                    appliedCoupon.percent /
                    100
                )
            );

    }


    const total =
        Math.max(
            0,
            subtotal - discount
        );


    const orderButton =
        document.querySelector(
            "#checkoutPage .primary-btn"
        );


    if(orderButton){

        orderButton.disabled = true;

        orderButton.textContent =
            "PROCESSING...";

    }


    try{


        /* ================= STOCK CHECK + UPDATE ================= */

        await runTransaction(
            db,
            async function(transaction){

                const productRefs = [];


                for(
                    const item of cart
                ){

                    const productRef =
                        doc(
                            db,
                            "products",
                            item.productId
                        );


                    productRefs.push({
                        item:item,
                        ref:productRef
                    });

                }


                const productSnapshots = [];


                for(
                    const entry of productRefs
                ){

                    const snapshot =
                        await transaction.get(
                            entry.ref
                        );


                    if(!snapshot.exists()){

                        throw new Error(
                            "Product not found: " +
                            entry.item.name
                        );

                    }


                    productSnapshots.push({
                        item:entry.item,
                        ref:entry.ref,
                        snapshot:snapshot
                    });

                }


                for(
                    const entry of productSnapshots
                ){

                    const currentStock =
                        Number(
                            entry.snapshot.data().stock || 0
                        );


                    const requestedQuantity =
                        Number(
                            entry.item.quantity || 0
                        );


                    if(
                        currentStock <
                        requestedQuantity
                    ){

                        throw new Error(
                            "Not enough stock for " +
                            entry.item.name +
                            ". Available: " +
                            currentStock
                        );

                    }


                    transaction.update(
                        entry.ref,
                        {

                            stock:
                                currentStock -
                                requestedQuantity,

                            updatedAt:
                                serverTimestamp()

                        }
                    );

                }

            }
        );


        /* ================= ORDER ITEMS ================= */

        const orderItems =
            cart.map(function(item){

                return {

                    productId:
                        item.productId,

                    name:
                        item.name,

                    price:
                        Number(
                            item.price || 0
                        ),

                    size:
                        item.size || "",

                    quantity:
                        Number(
                            item.quantity || 0
                        ),

                    image:
                        item.image || ""

                };

            });


        /* ================= CREATE ORDER ================= */

        const orderData = {

            customer:{

                name:name,

                phone:phone,

                email:email || "",

                address:address

            },

            items:
                orderItems,

            subtotal:
                subtotal,

            discount:
                discount,

            total:
                total,

            coupon:
                appliedCoupon
                    ? appliedCoupon.code
                    : "",

            paymentMethod:
                paymentMethod,

            status:
                "Pending",

            createdAt:
                serverTimestamp()

        };


        const orderRef =
            await addDoc(
                collection(
                    db,
                    "orders"
                ),
                orderData
            );


        /* ================= CLEAR CART ================= */

        cart = [];

        saveCart();

        updateCart();


        appliedCoupon = null;


        const couponInput =
            document.getElementById(
                "couponInput"
            );


        const couponMessage =
            document.getElementById(
                "couponMessage"
            );


        if(couponInput){

            couponInput.value = "";

        }


        if(couponMessage){

            couponMessage.textContent = "";

        }


        /* ================= RESET FORM ================= */

        const checkoutForm =
            document.getElementById(
                "checkoutForm"
            );


        if(checkoutForm){

            checkoutForm.reset();

        }


        /* ================= SHOW SUCCESS ================= */

        document
            .getElementById(
                "checkoutPage"
            )
            .classList.remove("active");


        document
            .getElementById(
                "mainWebsite"
            )
            .style.display = "none";


        const successPage =
            document.getElementById(
                "successPage"
            );


        successPage.classList.add(
            "active"
        );


        const successMessage =
            document.getElementById(
                "successMessage"
            );


        if(successMessage){

            successMessage.innerHTML = `

                Thank you,
                <strong>
                    ${escapeHtml(name)}
                </strong>.

                <br><br>

                Your order has been received.

                <br>

                Order ID:
                <strong>
                    ${escapeHtml(orderRef.id)}
                </strong>

                <br><br>

                Total Amount:
                <strong>
                    ₹${total}
                </strong>

            `;

        }


        window.scrollTo({
            top:0,
            behavior:"smooth"
        });


        /* ================= REFRESH PRODUCTS ================= */

        await loadProducts();


    }catch(error){

        console.error(
            "Order error:",
            error
        );


        alert(
            error?.message ||
            "Unable to place order. Please try again."
        );

    }finally{

        if(orderButton){

            orderButton.disabled = false;

            orderButton.textContent =
                "PLACE ORDER";

        }

    }

};


/* ================= BACK TO SHOP ================= */

window.backToShop =
function(){

    document
        .getElementById(
            "checkoutPage"
        )
        .classList.remove("active");


    document
        .getElementById(
            "successPage"
        )
        .classList.remove("active");


    document
        .getElementById(
            "mainWebsite"
        )
        .style.display = "";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

};


/* ================= MODAL BACKGROUND CLOSE ================= */

document.addEventListener(
    "click",
    function(event){

        const modal =
            document.getElementById(
                "productModal"
            );


        if(
            modal &&
            event.target === modal
        ){

            closeProductModal();

        }

    }
);


/* ================= ESC KEY ================= */

document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Escape"){

            closeProductModal();

            closeCart();

        }

    }
);


/* ================= START WEBSITE ================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        updateCart();

        loadProducts();

    }
);


</script>

</body>
</html>
