<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>TRENDY FACTORY — Men's Fashion</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f1eb;
    color:#111;
}

button,
input,
select,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.header{
    background:#111;
    color:#fff;
    padding:16px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:22px;
    font-weight:800;
    letter-spacing:1px;
}

.bag-btn{
    border:0;
    background:#d7c2a3;
    color:#111;
    padding:10px 16px;
    border-radius:8px;
    font-weight:700;
}

.hero{
    padding:45px 20px;
    text-align:center;
    background:#e8ddcf;
}

.hero h1{
    font-size:34px;
    margin-bottom:10px;
}

.hero p{
    color:#555;
    font-size:16px;
}

.container{
    width:100%;
    max-width:1200px;
    margin:auto;
    padding:25px 16px 60px;
}

.search-box{
    margin-bottom:20px;
}

.search-box input{
    width:100%;
    padding:14px 16px;
    border:1px solid #ddd;
    border-radius:10px;
    outline:none;
    background:#fff;
}

.categories{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:10px;
    margin-bottom:25px;
}

.category-btn{
    white-space:nowrap;
    border:1px solid #ccc;
    background:#fff;
    padding:10px 15px;
    border-radius:20px;
}

.category-btn.active{
    background:#111;
    color:#fff;
    border-color:#111;
}

.product-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.product-card{
    background:#fff;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 2px 10px rgba(0,0,0,.07);
    cursor:pointer;
    transition:.2s;
}

.product-card:hover{
    transform:translateY(-3px);
}

.product-image{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    display:block;
    background:#eee;
}

.product-info{
    padding:14px;
}

.product-info h3{
    font-size:17px;
    margin-bottom:8px;
}

.product-price{
    font-size:18px;
    font-weight:800;
    margin-bottom:6px;
}

.stock-text{
    font-size:12px;
    font-weight:700;
}

.in-stock{
    color:#198754;
}

.out-stock{
    color:#d9534f;
}

.loading,
.empty-message,
.error-message{
    text-align:center;
    padding:40px 15px;
    grid-column:1/-1;
}

.error-message{
    color:#d9534f;
}

.modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    z-index:500;
    padding:20px;
    overflow-y:auto;
}

.modal-overlay.show{
    display:flex;
    align-items:center;
    justify-content:center;
}

.modal{
    width:100%;
    max-width:850px;
    background:#fff;
    border-radius:14px;
    overflow:hidden;
    position:relative;
}

.close-btn{
    position:absolute;
    right:12px;
    top:12px;
    z-index:5;
    width:38px;
    height:38px;
    border:0;
    border-radius:50%;
    background:#111;
    color:#fff;
    font-size:22px;
}

.modal-content{
    display:grid;
    grid-template-columns:1fr 1fr;
}

.modal-left{
    padding:15px;
}

.modal-main-image{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    border-radius:10px;
    background:#eee;
}

.gallery{
    display:flex;
    gap:8px;
    margin-top:10px;
    overflow-x:auto;
}

.gallery img{
    width:65px;
    height:65px;
    object-fit:cover;
    border-radius:7px;
    cursor:pointer;
    border:2px solid transparent;
}

.gallery img:hover{
    border-color:#111;
}

.modal-right{
    padding:30px 25px;
}

.modal-right h2{
    margin-bottom:10px;
}

.modal-price{
    font-size:24px;
    font-weight:800;
    margin-bottom:15px;
}

.modal-description{
    color:#666;
    line-height:1.6;
    margin-bottom:20px;
}

.size-title{
    font-weight:700;
    margin-bottom:10px;
}

.size-options{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:20px;
}

.size-btn{
    border:1px solid #ccc;
    background:#fff;
    padding:9px 15px;
    border-radius:7px;
}

.size-btn.selected{
    background:#111;
    color:#fff;
}

.quantity-box{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:20px;
}

.quantity-box button{
    width:35px;
    height:35px;
    border:1px solid #ccc;
    background:#fff;
    border-radius:6px;
}

.add-cart-btn{
    width:100%;
    padding:14px;
    border:0;
    background:#111;
    color:#fff;
    border-radius:8px;
    font-weight:700;
}

.cart-panel{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.6);
    z-index:600;
}

.cart-panel.show{
    display:block;
}

.cart-box{
    position:absolute;
    right:0;
    top:0;
    height:100%;
    width:100%;
    max-width:430px;
    background:#fff;
    display:flex;
    flex-direction:column;
}

.cart-header{
    padding:18px;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.cart-items{
    flex:1;
    overflow-y:auto;
    padding:15px;
}

.cart-item{
    display:flex;
    gap:12px;
    padding:12px 0;
    border-bottom:1px solid #eee;
}

.cart-item img{
    width:75px;
    height:75px;
    object-fit:cover;
    border-radius:8px;
}

.cart-item-info{
    flex:1;
}

.cart-item-info h4{
    margin-bottom:5px;
}

.cart-item-price{
    font-weight:700;
}

.remove-cart{
    border:0;
    background:none;
    color:#d9534f;
    font-size:13px;
}

.cart-footer{
    padding:18px;
    border-top:1px solid #ddd;
}

.cart-total{
    display:flex;
    justify-content:space-between;
    font-size:19px;
    font-weight:800;
    margin-bottom:15px;
}

.checkout-btn{
    width:100%;
    padding:14px;
    border:0;
    background:#111;
    color:#fff;
    border-radius:8px;
    font-weight:700;
}

.checkout-page{
    display:none;
    min-height:100vh;
    padding:30px 16px;
}

.checkout-page.show{
    display:block;
}

.checkout-box{
    max-width:700px;
    margin:auto;
    background:#fff;
    padding:25px;
    border-radius:12px;
}

.checkout-box h2{
    margin-bottom:20px;
}

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    margin-bottom:6px;
    font-weight:600;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    outline:none;
}

.form-group textarea{
    min-height:90px;
    resize:vertical;
}

.checkout-items{
    margin-bottom:20px;
}

.checkout-summary{
    border-top:1px solid #ddd;
    margin-top:20px;
    padding-top:15px;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    margin-bottom:9px;
}

.summary-total{
    font-size:20px;
    font-weight:800;
    border-top:1px solid #ddd;
    padding-top:12px;
}

.coupon-box{
    display:flex;
    gap:8px;
    margin:15px 0;
}

.coupon-box input{
    flex:1;
    padding:11px;
    border:1px solid #ccc;
    border-radius:7px;
}

.coupon-box button{
    border:0;
    background:#111;
    color:#fff;
    padding:11px 15px;
    border-radius:7px;
}

.success-page{
    display:none;
    min-height:100vh;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:25px;
}

.success-page.show{
    display:flex;
}

.success-box{
    background:#fff;
    padding:35px 25px;
    border-radius:14px;
    max-width:500px;
    width:100%;
}

.success-box h2{
    margin-bottom:12px;
}

.whatsapp-btn{
    position:fixed;
    right:18px;
    bottom:18px;
    width:55px;
    height:55px;
    border-radius:50%;
    background:#25D366;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    font-size:25px;
    z-index:400;
}

@media(max-width:900px){

    .product-grid{
        grid-template-columns:repeat(3,1fr);
    }

}

@media(max-width:650px){

    .product-grid{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }

    .hero h1{
        font-size:27px;
    }

    .modal-content{
        grid-template-columns:1fr;
    }

    .modal-right{
        padding:20px;
    }

}

@media(max-width:400px){

    .product-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .product-info{
        padding:10px;
    }

    .product-info h3{
        font-size:15px;
    }

    .product-price{
        font-size:16px;
    }

}

</style>

</head>

<body>

<header class="header">

    <div class="logo">
        TRENDY FACTORY
    </div>

    <button
        class="bag-btn"
        onclick="openCart()"
    >
        BAG (<span id="cartCount">0</span>)
    </button>

</header>

<section class="hero">

    <h1>
        Men's Fashion
    </h1>

    <p>
        Trendy styles. Premium looks. Great prices.
    </p>

</section>

<main class="container">

    <div class="search-box">

        <input
            type="search"
            id="searchInput"
            placeholder="Search products..."
            oninput="filterProducts()"
        >

    </div>

    <div class="categories">

        <button
            class="category-btn active"
            onclick="setCategory('all',this)"
        >
            ALL
        </button>

        <button
            class="category-btn"
            onclick="setCategory('tshirt',this)"
        >
            T-SHIRTS
        </button>

        <button
            class="category-btn"
            onclick="setCategory('shirt',this)"
        >
            SHIRTS
        </button>

        <button
            class="category-btn"
            onclick="setCategory('jeans',this)"
        >
            JEANS
        </button>

        <button
            class="category-btn"
            onclick="setCategory('hoodie',this)"
        >
            HOODIES
        </button>

    </div>

    <div
        id="productGrid"
        class="product-grid"
    >

        <div class="loading">
            Loading products...
        </div>

    </div>

</main>

<div
    id="productModal"
    class="modal-overlay"
>

    <div class="modal">

        <button
            class="close-btn"
            onclick="closeProductModal()"
        >
            ×
        </button>

        <div class="modal-content">

            <div class="modal-left">

                <img
                    id="modalProductImage"
                    class="modal-main-image"
                    src=""
                    alt="Product"
                >

                <div
                    id="productImageGallery"
                    class="gallery"
                ></div>

            </div>

            <div class="modal-right">

                <h2 id="modalProductName">
                    Product
                </h2>

                <div
                    id="modalProductPrice"
                    class="modal-price"
                >
                    ₹0
                </div>

                <div
                    id="modalProductDescription"
                    class="modal-description"
                ></div>

                <div class="size-title">
                    Select Size
                </div>

                <div
                    id="sizeOptions"
                    class="size-options"
                ></div>

                <div class="quantity-box">

                    <button
                        onclick="changeModalQuantity(-1)"
                    >
                        −
                    </button>

                    <strong id="modalQuantity">
                        1
                    </strong>

                    <button
                        onclick="changeModalQuantity(1)"
                    >
                        +
                    </button>

                </div>

                <button
                    class="add-cart-btn"
                    onclick="addCurrentProductToCart()"
                >
                    ADD TO CART
                </button>

            </div>

        </div>

    </div>

</div>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs,
    addDoc,
    serverTimestamp,
    doc,
    runTransaction
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyCZjaf8zZe5p6xSoir4j5IdKc_MJE_Eyns",

    authDomain:
        "trendy-factory.firebaseapp.com",

    projectId:
        "trendy-factory",

    storageBucket:
        "trendy-factory.firebasestorage.app",

    messagingSenderId:
        "811817163762",

    appId:
        "1:811817163762:web:c9aecc5db2cb332a13696b",

    measurementId:
        "G-8YDMBE9T7C"

};


const app =
    initializeApp(firebaseConfig);

const db =
    getFirestore(app);


let products = [];

let filteredProducts = [];

let selectedCategory = "all";

let currentProduct = null;

let selectedSize = "";

let modalQuantity = 1;

let appliedCoupon = null;

let cart = [];

try{

    cart =
        JSON.parse(
            localStorage.getItem(
                "trendyFactoryCart"
            )
        ) || [];

}catch(error){

    cart = [];

}


function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function getImageUrl(product){

    if(
        Array.isArray(product.images) &&
        product.images.length
    ){

        const image =
            product.images[0];

        if(
            typeof image === "string" &&
            image.trim()
        ){

            return image;

        }

        if(
            image &&
            typeof image === "object" &&
            image.url
        ){

            return image.url;

        }

    }

    if(product.image){

        return product.image;

    }

    if(product.imageUrl){

        return product.imageUrl;

    }

    return "https://via.placeholder.com/600x600?text=TRENDY+FACTORY";

}


async function loadProducts(){

    const grid =
        document.getElementById(
            "productGrid"
        );

    if(grid){

        grid.innerHTML =
            '<div class="loading">Loading products...</div>';

    }

    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "products"
                )
            );

        products =
            snapshot.docs.map(
                function(item){

                    return {

                        id:item.id,

                        ...item.data()

                    };

                }
            );

        filteredProducts =
            [...products];

        renderProducts();

    }catch(error){

        console.error(
            "Product loading error:",
            error
        );

        if(grid){

            grid.innerHTML = `
                <div class="error-message">
                    Products load nahi ho rahe.<br>
                    Please try again.
                </div>
            `;

        }

    }

}


function renderProducts(){

    const grid =
        document.getElementById(
            "productGrid"
        );

    if(!grid){

        return;

    }

    if(!filteredProducts.length){

        grid.innerHTML = `
            <div class="empty-message">
                No products found.
            </div>
        `;

        return;

    }

    grid.innerHTML =
        filteredProducts.map(
            function(product){

                const stock =
                    Number(
                        product.stock || 0
                    );

                const image =
                    getImageUrl(product);

                return `

                    <div
                        class="product-card"
                        onclick="openProduct('${product.id}')"
                    >

                        <img
                            class="product-image"
                            src="${escapeHtml(image)}"
                            alt="${escapeHtml(product.name || "Product")}"
                            onerror="this.src='https://via.placeholder.com/600x600?text=No+Image'"
                        >

                        <div class="product-info">

                            <h3>
                                ${escapeHtml(
                                    product.name ||
                                    "Unnamed Product"
                                )}
                            </h3>

                            <div class="product-price">
                                ₹${Number(
                                    product.price || 0
                                )}
                            </div>

                            <div
                                class="stock-text ${
                                    stock > 0
                                        ? "in-stock"
                                        : "out-stock"
                                }"
                            >
                                ${
                                    stock > 0
                                        ? "IN STOCK"
                                        : "OUT OF STOCK"
                                }
                            </div>

                        </div>

                    </div>

                `;

            }
        ).join("");

}


function setCategory(
    category,
    button
){

    selectedCategory =
        category;

    document
        .querySelectorAll(
            ".category-btn"
        )
        .forEach(
            function(item){

                item.classList.remove(
                    "active"
                );

            }
        );

    if(button){

        button.classList.add(
            "active"
        );

    }

    filterProducts();

}


function filterProducts(){

    const searchInput =
        document.getElementById(
            "searchInput"
        );

    const search =
        (
            searchInput?.value ||
            ""
        )
        .trim()
        .toLowerCase();

    filteredProducts =
        products.filter(
            function(product){

                const name =
                    String(
                        product.name || ""
                    ).toLowerCase();

                const category =
                    String(
                        product.category || ""
                    ).toLowerCase();

                const matchesSearch =
                    !search ||
                    name.includes(search) ||
                    category.includes(search);

                const matchesCategory =
                    selectedCategory === "all" ||
                    category === selectedCategory;

                return (
                    matchesSearch &&
                    matchesCategory
                );

            }
        );

    renderProducts();

}
/* ================= PRODUCT MODAL ================= */

window.openProduct = function(id){

    currentProduct =
        products.find(function(product){

            return product.id === id;

        });

    if(!currentProduct){

        return;

    }

    const images =
        (currentProduct.images || [])
            .map(function(img){

                if(typeof img === "string"){

                    return img;

                }

                return img?.url || "";

            })
            .filter(Boolean);


    if(!images.length){

        images.push(
            getImageUrl(currentProduct)
        );

    }


    const mainImage =
        document.getElementById(
            "modalProductImage"
        );

    const gallery =
        document.getElementById(
            "productImageGallery"
        );

    const name =
        document.getElementById(
            "modalProductName"
        );

    const price =
        document.getElementById(
            "modalProductPrice"
        );

    const description =
        document.getElementById(
            "modalProductDescription"
        );


    if(mainImage){

        mainImage.src =
            images[0];

        mainImage.onerror =
            function(){

                this.src =
                    "https://via.placeholder.com/600x600?text=No+Image";

            };

    }


    if(gallery){

        gallery.innerHTML =
            images.map(function(image){

                return `

                    <img
                        src="${escapeHtml(image)}"
                        alt="Product image"
                        onclick="changeMainImage('${escapeHtml(image)}')"
                        onerror="this.style.display='none'"
                    >

                `;

            }).join("");

    }


    if(name){

        name.textContent =
            currentProduct.name ||
            "Product";

    }


    if(price){

        price.textContent =
            "₹" +
            Number(
                currentProduct.price || 0
            );

    }


    if(description){

        description.textContent =
            currentProduct.description ||
            "Premium quality product.";

    }


    selectedSize = "";

    modalQuantity = 1;


    const quantity =
        document.getElementById(
            "modalQuantity"
        );

    if(quantity){

        quantity.textContent =
            modalQuantity;

    }


    renderSizes();


    const modal =
        document.getElementById(
            "productModal"
        );

    if(modal){

        modal.classList.add(
            "show"
        );

    }

};


window.changeMainImage = function(image){

    const mainImage =
        document.getElementById(
            "modalProductImage"
        );

    if(mainImage){

        mainImage.src =
            image;

    }

};


/* ================= CLOSE MODAL ================= */

window.closeProductModal = function(){

    const modal =
        document.getElementById(
            "productModal"
        );

    if(modal){

        modal.classList.remove(
            "show"
        );

    }

};


/* ================= PRODUCT SIZES ================= */

function renderSizes(){

    const container =
        document.getElementById(
            "sizeOptions"
        );

    if(!container){

        return;

    }


    const sizes =
        currentProduct?.sizes || [];

    let sizeList = [];


    if(Array.isArray(sizes)){

        sizeList =
            sizes;

    }else if(
        typeof sizes === "string"
    ){

        sizeList =
            sizes
                .split(",")
                .map(function(size){

                    return size.trim();

                })
                .filter(Boolean);

    }


    if(!sizeList.length){

        sizeList = [
            "S",
            "M",
            "L",
            "XL",
            "XXL"
        ];

    }


    container.innerHTML =
        sizeList.map(function(size){

            const active =
                selectedSize === size
                    ? "selected"
                    : "";

            return `

                <button
                    type="button"
                    class="size-btn ${active}"
                    onclick="selectSize('${escapeHtml(size)}')"
                >
                    ${escapeHtml(size)}
                </button>

            `;

        }).join("");

}


window.selectSize = function(size){

    selectedSize =
        size;

    renderSizes();

};


window.changeModalQuantity =
    function(change){

        let newQuantity =
            modalQuantity +
            Number(change);

        const stock =
            Number(
                currentProduct?.stock || 0
            );


        if(newQuantity < 1){

            newQuantity = 1;

        }


        if(
            stock > 0 &&
            newQuantity > stock
        ){

            newQuantity =
                stock;

        }


        modalQuantity =
            newQuantity;


        const quantity =
            document.getElementById(

/* ================= ADD TO CART ================= */

window.addCurrentProductToCart =
    function(){

        if(!currentProduct){

            return;

        }


        const stock =
            Number(
                currentProduct.stock || 0
            );


        if(stock <= 0){

            alert(
                "This product is out of stock."
            );

            return;

        }


        if(!selectedSize){

            alert(
                "Please select a size."
            );

            return;

        }


        const existing =
            cart.find(function(item){

                return (
                    item.id === currentProduct.id &&
                    item.size === selectedSize
                );

            });


        if(existing){

            const newQuantity =
                Number(
                    existing.quantity || 0
                ) +
                Number(
                    modalQuantity || 1
                );


            if(newQuantity > stock){

                alert(
                    "Only " +
                    stock +
                    " item(s) available in stock."
                );

                return;

            }


            existing.quantity =
                newQuantity;

        }else{

            cart.push({

                id:
                    currentProduct.id,

                name:
                    currentProduct.name ||
                    "Product",

                price:
                    Number(
                        currentProduct.price || 0
                    ),

                image:
                    getImageUrl(
                        currentProduct
                    ),

                size:
                    selectedSize,

                quantity:
                    Number(
                        modalQuantity || 1
                    )

            });

        }


        saveCart();

        updateCart();

        closeProductModal();

        alert(
            "Product added to cart."
        );

/* ================= CART ================= */

window.updateCart = function(){

    const count =
        cart.reduce(
            function(total,item){

                return total +
                    Number(
                        item.quantity || 0
                    );

            },
            0
        );


    const cartCount =
        document.getElementById(
            "cartCount"
        );


    if(cartCount){

        cartCount.textContent =
            count;

    }


    renderCart();

};


function getCartSubtotal(){

    return cart.reduce(
        function(total,item){

            return total +
                Number(
                    item.price || 0
                ) *
                Number(
                    item.quantity || 0
                );

        },
        0
    );

}


function renderCart(){

    const container =
        document.getElementById(
            "cartItems"
        );

    const totalElement =
        document.getElementById(
            "cartTotal"
        );


    if(!container){

        return;

    }


    if(!cart.length){

        container.innerHTML = `

            <div
                style="
                    text-align:center;
                    padding:40px 10px;
                    color:#777;
                "
            >
                Your bag is empty.
            </div>

        `;


        if(totalElement){

            totalElement.textContent =
                "₹0";

        }

        return;

    }


    container.innerHTML =
        cart.map(
            function(item,index){

                const itemTotal =
                    Number(
                        item.price || 0
                    ) *
                    Number(
                        item.quantity || 0
                    );


                return `

                    <div class="cart-item">

                        <img
                            src="${escapeHtml(
                                item.image ||
                                "https://via.placeholder.com/100"
                            )}"
                            alt="${escapeHtml(
                                item.name ||
                                "Product"
                            )}"
                            onerror="
                                this.src='https://via.placeholder.com/100?text=No+Image'
                            "
                        >


                        <div class="cart-item-info">

                            <h4>
                                ${escapeHtml(
                                    item.name ||
                                    "Product"
                                )}
                            </h4>


                            <div
                                style="
                                    font-size:13px;
                                    color:#666;
                                "
                            >
                                Size:
                                ${escapeHtml(
                                    item.size || "-"
                                )}
                            </div>


                            <div
                                style="
                                    font-size:13px;
                                    color:#666;
                                "
                            >
                                Quantity:
                                ${Number(
                                    item.quantity || 0
                                )}
                            </div>


                            <div class="cart-item-price">

                                ₹${itemTotal}

                            </div>


                            <button
                                class="remove-cart"
                                onclick="
                                    removeCartItem(${index})
                                "
                            >
                                REMOVE
                            </button>

                        </div>

                    </div>

                `;

            }
        ).join("");


    if(totalElement){

        totalElement.textContent =
            "₹" +
            getCartSubtotal();

    }

}

    function(index){

/* ================= COUPON ================= */

window.applyCoupon =
    function(){

        const input =
            document.getElementById(
                "couponInput"
            );

        const message =
            document.getElementById(
                "couponMessage"
            );


        if(!input){

            return;

        }


        const code =
            input.value
                .trim()
                .toUpperCase();


        if(code === "TRENDY10"){

            appliedCoupon = {

                code:
                    "TRENDY10",

                percent:
                    10

            };


            if(message){

                message.textContent =
                    "Coupon applied successfully — 10% OFF.";

                message.style.color =
                    "#198754";

            }

        }else{

            appliedCoupon =
                null;


            if(message){

                message.textContent =
                    "Invalid coupon code.";

                message.style.color =
                    "#d9534f";

            }

        }


        updateCheckoutTotals();

    };


/* ================= CHECKOUT TOTALS ================= */

function updateCheckoutTotals(){

    const subtotal =
        getCartSubtotal();


    let discount =
        0;


    if(appliedCoupon){

        discount =
            subtotal *
            (
                Number(
                    appliedCoupon.percent || 0
                ) / 100
            );

    }


    const total =
        Math.max(
            0,
            subtotal - discount
        );


    const checkoutSubtotal =
        document.getElementById(
            "checkoutSubtotal"
        );

    const discountRow =
        document.getElementById(
            "discountRow"
        );

    const checkoutDiscount =
        document.getElementById(
            "checkoutDiscount"
        );

    const checkoutTotal =
        document.getElementById(
            "checkoutTotal"
        );


    if(checkoutSubtotal){

        checkoutSubtotal.textContent =
            "₹" +
            subtotal.toFixed(2);

    }


    if(checkoutDiscount){

        checkoutDiscount.textContent =
            "₹" +
            discount.toFixed(2);

    }


    if(checkoutTotal){

        checkoutTotal.textContent =
            "₹" +
            total.toFixed(2);

    }


    if(discountRow){

        discountRow.style.display =
            discount > 0
                ? "flex"
                : "none";

    }

    }

function getCheckoutData(){

    const name =
        document.getElementById(
            "customerName"
        )?.value.trim() || "";

    const phone =
        document.getElementById(
            "customerPhone"
        )?.value.trim() || "";

    const email =
        document.getElementById(
            "customerEmail"
        )?.value.trim() || "";

    const address =
        document.getElementById(
            "customerAddress"
        )?.value.trim() || "";

    const paymentMethod =
        document.getElementById(
            "paymentMethod"
        )?.value || "";


    return {
        name,
        phone,
        email,
        address,
        paymentMethod
    };

}


/* ================= PLACE ORDER ================= */

window.placeOrder =
    async function(){

        if(!cart.length){

            alert(
                "Your bag is empty."
            );

            return;

        }


        const data =
            getCheckoutData();


        if(!data.name){

            alert(
                "Please enter your name."
            );

            return;

        }


        if(!/^[0-9]{10}$/.test(data.phone)){

            alert(
                "Please enter a valid 10 digit mobile number."
            );

            return;

        }


        if(!data.address){

            alert(
                "Please enter your delivery address."
            );

            return;

        }


        if(!data.paymentMethod){

            alert(
                "Please select a payment method."
            );

            return;

        }


        const subtotal =
            getCartSubtotal();


        let discount =
            0;


        if(appliedCoupon){

            discount =
                subtotal *
                (
                    Number(
                        appliedCoupon.percent || 0
                    ) / 100
                );

        }


        const total =
            Math.max(
                0,
                subtotal - discount
            );


        const orderItems =
            cart.map(
                function(item){

                    return {

                        productId:
                            item.id,

                        name:
                            item.name,

                        price:
                            Number(
                                item.price || 0
                            ),

                        size:
                            item.size || "",

                        quantity:
                            Number(
                                item.quantity || 1
                            ),

                        image:
                            item.image || ""

                    };

                }
            );


        const orderData = {

            customerName:
                data.name,

            customerPhone:
                data.phone,

            customerEmail:
                data.email,

            customerAddress:
                data.address,

            paymentMethod:
                data.paymentMethod,

            items:
                orderItems,

            subtotal:
                subtotal,

            discount:
                discount,

            total:
                total,

            coupon:
                appliedCoupon
                    ? appliedCoupon.code
                    : "",

            status:
                "pending",

            createdAt:
                serverTimestamp()

        };


        const button =
            document.querySelector(
                '#checkoutForm button[type="submit"]'
            );


        if(button){

            button.disabled =
                true;

            button.textContent =
                "PLACING ORDER...";

        }


        try{

            const ordersRef =
                collection(
                    db,
                    "orders"
                );


            const orderRef =
                await addDoc(
                    ordersRef,
                    orderData
                );


            /*
             * Reduce product stock
             * after successful order.
             */

            for(
                const item of cart
            ){

                try{

                    const productRef =
                        doc(
                            db,
                            "products",
                            item.id
                        );


                    await runTransaction(
                        db,
                        async function(transaction){

                            const snapshot =
                                await transaction.get(
                                    productRef
                                );


                            if(!snapshot.exists()){

                                return;

                            }


                            const product =
                                snapshot.data();


                            const oldStock =
                                Number(
                                    product.stock || 0
                                );


                            const orderedQuantity =
                                Number(
                                    item.quantity || 1
                                );


                            const newStock =
                                Math.max(
                                    0,
                                    oldStock -
                                    orderedQuantity
                                );


                            transaction.update(
                                productRef,
                                {
                                    stock:
                                        newStock
                                }
                            );

                        }
                    );

                }catch(stockError){

                    console.error(
                        "Stock update error:",
                        stockError
                    );

                }

            }


            const orderId =
                orderRef.id;


            cart = [];

            appliedCoupon =
                null;


            saveCart();

            updateCart();


            const form =
                document.getElementById(
                    "checkoutForm"
                );


            if(form){

                form.reset();

            }


            const checkoutPage =
                document.getElementById(
                    "checkoutPage"
                );

            const successPage =
                document.getElementById(
                    "successPage"
                );

            const successMessage =
                document.getElementById(
                    "successMessage"
                );


            if(checkoutPage){

                checkoutPage.classList.remove(
                    "show"
                );

            }


            if(successMessage){

                successMessage.textContent =
                    "Your order ID is " +
                    orderId +
                    ". We will contact you shortly.";

            }


            if(successPage){

                successPage.classList.add(
                    "show"
                );

            }


            window.scrollTo({
                top:0,
                behavior:"smooth"
            });


            /*
             * Refresh products so the
             * updated stock appears.
             */

            await loadProducts();


        }catch(error){

            console.error(
                "Order error:",
                error
            );


            alert(
                "Order could not be placed. Please try again."
            );


        }finally{

            if(button){

                button.disabled =
                    false;

                button.textContent =
                    "PLACE ORDER";

            }

        }

    };
